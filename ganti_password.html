<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password - SIM PMKP RSUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 440px;
            padding: 36px 30px;
            border-top: 5px solid #6f42c1;
        }
        .brand-logo {
            width: 64px; height: 64px;
            background: rgba(111, 66, 193, 0.1); color: #6f42c1;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            margin: 0 auto 16px auto;
        }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(111, 66, 193, 0.2); border-color: #6f42c1; }
        .syarat li { font-size: 0.8rem; }
        .syarat li.ok { color: #198754; }
        .syarat li.ok i::before { content: "\f00c"; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo"><i class="fas fa-key"></i></div>
        <h4 class="fw-bold text-dark mb-1 text-center">Ganti Password</h4>
        <p class="text-muted text-center mb-3" style="font-size: 0.9rem;" id="infoAkun">Memuat akun...</p>

        <div class="alert alert-warning py-2 px-3 d-none" id="bannerWajib" style="font-size: 0.85rem;">
            <i class="fas fa-exclamation-triangle me-1"></i>
            Password Anda telah di-reset oleh administrator. <b>Buat password baru</b> sebelum dapat menggunakan aplikasi.
        </div>

        <form id="formGanti" onsubmit="simpanPassword(event)" autocomplete="off">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.85rem;" id="labelLama">Password Lama</label>
                <input type="password" class="form-control" id="inp_lama" required autocomplete="current-password">
            </div>
            <div class="mb-2">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.85rem;">Password Baru</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="inp_baru" required autocomplete="new-password" oninput="cekSyarat()">
                    <button class="btn btn-outline-secondary" type="button" onclick="tampilkan()" title="Tampilkan password"><i class="fas fa-eye" id="ikonMata"></i></button>
                </div>
            </div>
            <ul class="list-unstyled syarat text-muted mb-3 ps-1" id="daftarSyarat">
                <li id="s_panjang"><i class="fas fa-circle fa-xs me-2"></i>Minimal 8 karakter</li>
                <li id="s_default"><i class="fas fa-circle fa-xs me-2"></i>Bukan password default</li>
                <li id="s_username"><i class="fas fa-circle fa-xs me-2"></i>Tidak mengandung username</li>
            </ul>
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.85rem;">Ulangi Password Baru</label>
                <input type="password" class="form-control" id="inp_ulang" required autocomplete="new-password">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary fw-bold py-2" id="btnSimpan" style="background-color:#6f42c1; border-color:#6f42c1;">
                    <i class="fas fa-save me-2"></i> Simpan Password Baru
                </button>
                <a href="index.html" class="btn btn-light" id="btnKembali"><i class="fas fa-arrow-left me-2"></i> Kembali</a>
                <button type="button" class="btn btn-link text-danger d-none" id="btnKeluar" onclick="keluar()"><i class="fas fa-sign-out-alt me-1"></i> Logout</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20261005"></script>

    <script>
        // Halaman ini sengaja TIDAK memuat auth.js: auth.js akan mengarahkan
        // akun "wajib ganti password" ke sini, jadi halaman ini harus bisa
        // dibuka tanpa melewati pengecekan RBAC.
        const PASSWORD_DEFAULT_UI = 'muturssa'; // hanya untuk petunjuk; aturan sebenarnya dicek di server
        let usernameAktif = '';
        let modeWajib = false;

        (async function init() {
            if (!supabaseClient) return;
            const { data } = await supabaseClient.auth.getSession();
            if (!data.session) { window.location.href = 'login.html'; return; }

            const email = data.session.user.email || '';
            usernameAktif = keUsernameLogin(email).split('@')[0];

            const { data: profil } = await supabaseClient
                .from('profiles').select('*').eq('id', data.session.user.id).maybeSingle();
            modeWajib = !!(profil && profil.wajib_ganti_password);

            document.getElementById('infoAkun').innerHTML =
                `Akun: <b>${esc(keUsernameLogin(email))}</b>` + (profil && profil.nama_lengkap ? ` &middot; ${esc(profil.nama_lengkap)}` : '');

            if (modeWajib) {
                document.getElementById('bannerWajib').classList.remove('d-none');
                document.getElementById('btnKembali').classList.add('d-none');
                document.getElementById('btnKeluar').classList.remove('d-none');
                document.getElementById('labelLama').textContent = 'Password Saat Ini (password default dari admin)';
            }
        })();

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function cekSyarat() {
            const v = document.getElementById('inp_baru').value;
            const set = (id, ok) => document.getElementById(id).classList.toggle('ok', ok);
            set('s_panjang', v.length >= 8);
            set('s_default', v.length > 0 && v.toLowerCase() !== PASSWORD_DEFAULT_UI);
            set('s_username', v.length > 0 && !(usernameAktif && v.toLowerCase().includes(usernameAktif)));
        }

        function tampilkan() {
            const el = document.getElementById('inp_baru');
            const ul = document.getElementById('inp_ulang');
            const lihat = el.type === 'password';
            el.type = ul.type = lihat ? 'text' : 'password';
            document.getElementById('ikonMata').className = lihat ? 'fas fa-eye-slash' : 'fas fa-eye';
        }

        async function simpanPassword(e) {
            e.preventDefault();
            const lama = document.getElementById('inp_lama').value;
            const baru = document.getElementById('inp_baru').value;
            const ulang = document.getElementById('inp_ulang').value;

            if (baru !== ulang) { Swal.fire('Oops', 'Ulangan password baru tidak sama.', 'warning'); return; }
            if (baru.length < 8) { Swal.fire('Oops', 'Password baru minimal 8 karakter.', 'warning'); return; }

            const btn = document.getElementById('btnSimpan');
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menyimpan...';

            try {
                const { error } = await supabaseClient.functions.invoke('admin-manage-users', {
                    body: { action: 'ganti_password_sendiri', password_lama: lama, password_baru: baru }
                });
                if (error) {
                    let pesan = error.message || 'Gagal menghubungi server.';
                    try { const j = await error.context.json(); if (j && j.error) pesan = j.error; } catch (_) {}
                    throw new Error(pesan);
                }

                // Perbarui cache sesi supaya auth.js tidak mengarahkan ke sini lagi
                try {
                    const sesi = JSON.parse(localStorage.getItem('sessionMutu')) || {};
                    sesi.wajib_ganti_password = false;
                    localStorage.setItem('sessionMutu', JSON.stringify(sesi));
                } catch (_) {}

                await Swal.fire({ title: 'Berhasil!', text: 'Password Anda telah diperbarui. Gunakan password baru ini untuk login berikutnya.', icon: 'success' });
                window.location.href = 'index.html';
            } catch (err) {
                Swal.fire('Gagal', err.message, 'error');
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-2"></i> Simpan Password Baru';
            }
        }

        async function keluar() {
            await supabaseClient.auth.signOut({ scope: 'local' });
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
