<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Audit - SIM PMKP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background-color: #f0f2f5; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 4px 12px rgba(0,0,0,.05); border-radius: 12px; border: none; background: #fff; }
        .table-custom th { background-color: #2c3e50; color: white; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; border: none; padding: 10px; white-space: nowrap; }
        .table-custom td { vertical-align: middle; font-size: 0.88rem; border-bottom: 1px solid #f1f3f5; padding: 10px; }
        .table-custom tbody tr { cursor: pointer; }
        .table-custom tbody tr:hover { background: #f8f6ff; }
        .aksi-INSERT { background: #d1e7dd; color: #0f5132; }
        .aksi-UPDATE { background: #fff3cd; color: #664d03; }
        .aksi-DELETE { background: #f8d7da; color: #842029; }
        .aksi-TUTUP_TAHUN { background: #e2d9f3; color: #432874; }
        .aksi-GANTI_NAMA_UNIT, .aksi-IMPOR { background: #fff3cd; color: #664d03; }
        .badge-aksi { font-weight: 600; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; }
        .kolom-chip { display: inline-block; background: #eef; color: #334; border-radius: 4px; padding: 1px 6px; margin: 1px; font-size: 0.75rem; font-family: monospace; }
        .nilai { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; max-width: 420px; }
        .nilai-lama { background: #fff5f5; }
        .nilai-baru { background: #f3fbf5; }
        .filter-label { font-size: 0.75rem; font-weight: 700; color: #6c757d; text-transform: uppercase; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4" style="max-width: 1300px;">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h3 class="mb-1 text-dark fw-bold"><i class="fas fa-history text-primary me-2"></i> Log Audit</h3>
                <p class="text-muted mb-0">Catatan otomatis setiap penambahan, perubahan, dan penghapusan data. Log tidak dapat diubah atau dihapus.</p>
            </div>
        </div>

        <!-- FILTER -->
        <div class="card-custom p-3 mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-6 col-md-2">
                    <div class="filter-label">Tabel</div>
                    <select class="form-select form-select-sm" id="f_tabel"></select>
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">Aksi</div>
                    <select class="form-select form-select-sm" id="f_aksi">
                        <option value="">Semua</option>
                        <option value="INSERT">Tambah</option>
                        <option value="UPDATE">Ubah</option>
                        <option value="DELETE">Hapus</option>
                        <option value="TUTUP_TAHUN">Tutup Tahun</option>
                        <option value="IMPOR">Impor Data</option>
                        <option value="GANTI_NAMA_UNIT">Ganti Nama Unit</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <div class="filter-label">Pengguna (nama / username)</div>
                    <input type="text" class="form-control form-control-sm" id="f_user" placeholder="mis. budi">
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">Dari tanggal</div>
                    <input type="date" class="form-control form-control-sm" id="f_dari">
                </div>
                <div class="col-6 col-md-2">
                    <div class="filter-label">Sampai tanggal</div>
                    <input type="date" class="form-control form-control-sm" id="f_sampai">
                </div>
                <div class="col-12 col-md-1 d-grid">
                    <button class="btn btn-sm btn-primary fw-bold" onclick="terapkanFilter()"><i class="fas fa-search"></i></button>
                </div>
            </div>
            <div class="mt-2 d-none" id="infoRiwayat">
                <span class="badge bg-info text-dark p-2"><i class="fas fa-stream me-1"></i> Riwayat satu baris: <span id="teksRiwayat"></span>
                    <a href="#" class="ms-2 text-dark" onclick="hapusFilterRiwayat(); return false;" title="Tampilkan semua"><i class="fas fa-times"></i></a></span>
            </div>
        </div>

        <!-- TABEL -->
        <div class="card-custom p-3">
            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                <small class="text-muted" id="infoJumlah">Memuat...</small>
                <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-secondary" id="btnPrev" onclick="pindahHalaman(-1)"><i class="fas fa-chevron-left"></i></button>
                    <button class="btn btn-outline-secondary disabled" id="infoHalaman">1</button>
                    <button class="btn btn-outline-secondary" id="btnNext" onclick="pindahHalaman(1)"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-custom mb-0">
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Pengguna</th>
                            <th>Aksi</th>
                            <th>Data</th>
                            <th>Kolom Berubah</th>
                        </tr>
                    </thead>
                    <tbody id="bodyLog">
                        <tr><td colspan="5" class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin me-2"></i> Memuat log...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL -->
    <div class="modal fade" id="modalDetail" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold"><i class="fas fa-search-plus me-2 text-warning"></i> Detail Perubahan</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="isiDetail"></div>
                <div class="modal-footer">
                    <button class="btn btn-outline-primary" id="btnRiwayatBaris"><i class="fas fa-stream me-1"></i> Lihat seluruh riwayat data ini</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20261007"></script>
    <script src="auth.js?v=20261005b"></script>
    <script src="components.js?v=20261007"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Akses halaman diatur oleh RBAC; isi log hanya bisa dibaca role administrator (RLS).
        const PER_HALAMAN = 50;
        const NAMA_TABEL = {
            data_mutu_harian: 'Data Mutu Harian',
            data_insiden: 'Insiden (IKP/KPC)',
            data_risiko: 'Register Risiko',
            data_pdsa: 'PDSA',
            data_fmea: 'FMEA',
            data_validasi: 'Validasi Mutu',
            arsip_capaian_mutu: 'Arsip Capaian',
            master_indikator: 'Profil Indikator',
            master_unit: 'Unit Kerja',
            setup_formulir: 'Formulir (Form Builder)',
            role_permissions: 'Hak Akses (RBAC)',
            profiles: 'Akun Pengguna'
        };
        // Kolom yang paling membantu untuk mengenali sebuah baris
        const KOLOM_JUDUL = ['judul_indikator', 'nama_unit', 'nama_proses', 'risiko_teridentifikasi', 'jenis_insiden',
                             'nama_lengkap', 'role', 'id_form', 'unit_kerja', 'unit_pelapor'];
        const LABEL_AKSI = { INSERT: 'Tambah', UPDATE: 'Ubah', DELETE: 'Hapus', TUTUP_TAHUN: 'Tutup Tahun', IMPOR: 'Impor Data', GANTI_NAMA_UNIT: 'Ganti Nama Unit' };

        let halaman = 0;
        let totalBaris = 0;
        let dataHalaman = [];
        let filterRiwayat = null; // { tabel, id_baris }

        document.addEventListener('DOMContentLoaded', () => {
            const sel = document.getElementById('f_tabel');
            sel.add(new Option('Semua', ''));
            Object.entries(NAMA_TABEL).forEach(([k, v]) => sel.add(new Option(v, k)));
            ['f_user'].forEach(id => document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') terapkanFilter(); }));
            muatLog();
        });

        function terapkanFilter() { halaman = 0; muatLog(); }
        function pindahHalaman(arah) { halaman = Math.max(0, halaman + arah); muatLog(); }
        function hapusFilterRiwayat() {
            filterRiwayat = null;
            document.getElementById('infoRiwayat').classList.add('d-none');
            halaman = 0; muatLog();
        }

        async function muatLog() {
            const body = document.getElementById('bodyLog');
            body.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted"><i class="fas fa-spinner fa-spin me-2"></i> Memuat log...</td></tr>';

            let q = supabaseClient.from('audit_log').select('*', { count: 'exact' });

            if (filterRiwayat) {
                q = q.eq('tabel', filterRiwayat.tabel).eq('id_baris', filterRiwayat.id_baris);
            } else {
                const tabel = document.getElementById('f_tabel').value;
                const aksi = document.getElementById('f_aksi').value;
                const user = document.getElementById('f_user').value.trim().replace(/[%,()]/g, '');
                const dari = document.getElementById('f_dari').value;
                const sampai = document.getElementById('f_sampai').value;
                if (tabel) q = q.eq('tabel', tabel);
                if (aksi) q = q.eq('aksi', aksi);
                if (user) q = q.or(`user_email.ilike.%${user}%,user_nama.ilike.%${user}%`);
                if (dari) q = q.gte('waktu', `${dari}T00:00:00+07:00`);
                if (sampai) q = q.lte('waktu', `${sampai}T23:59:59.999+07:00`);
            }

            const dariBaris = halaman * PER_HALAMAN;
            const { data, error, count } = await q.order('waktu', { ascending: false }).order('id', { ascending: false })
                .range(dariBaris, dariBaris + PER_HALAMAN - 1);

            if (error) {
                console.error(error);
                body.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-danger">Gagal memuat log: ${esc(error.message)}</td></tr>`;
                return;
            }

            dataHalaman = data || [];
            totalBaris = count || 0;
            const maksHalaman = Math.max(1, Math.ceil(totalBaris / PER_HALAMAN));
            document.getElementById('infoJumlah').textContent = totalBaris === 0
                ? 'Tidak ada entri log.'
                : `Menampilkan ${dariBaris + 1}–${dariBaris + dataHalaman.length} dari ${totalBaris.toLocaleString('id-ID')} entri`;
            document.getElementById('infoHalaman').textContent = `${halaman + 1} / ${maksHalaman}`;
            document.getElementById('btnPrev').disabled = halaman === 0;
            document.getElementById('btnNext').disabled = halaman + 1 >= maksHalaman;

            if (dataHalaman.length === 0) {
                body.innerHTML = '<tr><td colspan="5" class="text-center py-5 text-muted">Tidak ada entri yang cocok dengan filter.</td></tr>';
                return;
            }

            body.innerHTML = dataHalaman.map((r, i) => `
                <tr onclick="bukaDetail(${i})">
                    <td class="text-nowrap">${esc(formatWaktu(r.waktu))}</td>
                    <td>
                        <div class="fw-bold">${esc(r.user_nama || keUsernameLogin(r.user_email || '') || '-')}</div>
                        <small class="text-muted">${esc(r.user_role || '')}</small>
                    </td>
                    <td><span class="badge-aksi aksi-${esc(r.aksi)}">${esc(LABEL_AKSI[r.aksi] || r.aksi)}</span></td>
                    <td>
                        <div class="fw-semibold">${esc(NAMA_TABEL[r.tabel] || r.tabel)}</div>
                        <small class="text-muted">${esc(judulBaris(r))}</small>
                    </td>
                    <td>${(r.kolom_berubah || []).map(k => `<span class="kolom-chip">${esc(k)}</span>`).join('') || '<span class="text-muted">—</span>'}</td>
                </tr>`).join('');
        }

        function formatWaktu(iso) {
            return new Date(iso).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function judulBaris(r) {
            const d = r.data_baru || r.data_lama || {};
            if (r.aksi === 'TUTUP_TAHUN') return `Tahun ${r.id_baris}`;
            if (r.aksi === 'GANTI_NAMA_UNIT') return `${d.lama || r.id_baris} → ${d.baru || ''}${d.gabung ? ' (digabung)' : ''}`;
            for (const k of KOLOM_JUDUL) {
                if (d[k]) return String(d[k]).slice(0, 80);
            }
            return r.id_baris ? `ID ${String(r.id_baris).slice(0, 13)}` : '';
        }

        function tampilNilai(v) {
            if (v === null || v === undefined) return '<span class="text-muted fst-italic">kosong</span>';
            const teks = typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v);
            return esc(teks.length > 2000 ? teks.slice(0, 2000) + ' …' : teks);
        }

        function bukaDetail(i) {
            const r = dataHalaman[i];
            if (!r) return;
            const lama = r.data_lama || {};
            const baru = r.data_baru || {};

            let kolom;
            if (r.aksi === 'UPDATE') kolom = r.kolom_berubah || [];
            else kolom = Object.keys(r.aksi === 'DELETE' ? lama : baru);

            const tampilLama = !['INSERT', 'TUTUP_TAHUN', 'IMPOR', 'GANTI_NAMA_UNIT'].includes(r.aksi);
            const tampilBaru = r.aksi !== 'DELETE';

            let html = `
                <div class="row g-2 mb-3 small">
                    <div class="col-md-3"><b>Waktu</b><br>${esc(formatWaktu(r.waktu))}</div>
                    <div class="col-md-3"><b>Pengguna</b><br>${esc(r.user_nama || '-')}<br><span class="text-muted">${esc(r.user_email || '')} · ${esc(r.user_role || '')}</span></div>
                    <div class="col-md-3"><b>Aksi</b><br><span class="badge-aksi aksi-${esc(r.aksi)}">${esc(LABEL_AKSI[r.aksi] || r.aksi)}</span> pada ${esc(NAMA_TABEL[r.tabel] || r.tabel)}</div>
                    <div class="col-md-3"><b>ID Data</b><br><code>${esc(r.id_baris || '-')}</code></div>
                </div>
                <div class="table-responsive"><table class="table table-sm table-bordered align-top">
                    <thead class="table-light"><tr><th style="width:18%">Kolom</th>
                        ${tampilLama ? '<th>Nilai Lama</th>' : ''}${tampilBaru ? '<th>Nilai Baru</th>' : ''}</tr></thead><tbody>`;

            kolom.forEach(k => {
                html += `<tr><td class="fw-bold"><code>${esc(k)}</code></td>
                    ${tampilLama ? `<td class="nilai nilai-lama">${tampilNilai(lama[k])}</td>` : ''}
                    ${tampilBaru ? `<td class="nilai nilai-baru">${tampilNilai(baru[k])}</td>` : ''}</tr>`;
            });
            html += '</tbody></table></div>';
            if (r.aksi === 'UPDATE') html += '<small class="text-muted">Hanya kolom yang berubah yang ditampilkan.</small>';

            document.getElementById('isiDetail').innerHTML = html;

            const btn = document.getElementById('btnRiwayatBaris');
            btn.classList.toggle('d-none', !r.id_baris || ['TUTUP_TAHUN', 'IMPOR', 'GANTI_NAMA_UNIT'].includes(r.aksi));
            btn.onclick = () => {
                bootstrap.Modal.getInstance(document.getElementById('modalDetail')).hide();
                filterRiwayat = { tabel: r.tabel, id_baris: r.id_baris };
                document.getElementById('teksRiwayat').textContent = `${NAMA_TABEL[r.tabel] || r.tabel} — ${judulBaris(r)}`;
                document.getElementById('infoRiwayat').classList.remove('d-none');
                halaman = 0; muatLog();
            };

            new bootstrap.Modal(document.getElementById('modalDetail')).show();
        }
    </script>
</body>
</html>
