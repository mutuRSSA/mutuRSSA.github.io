<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Kepatuhan - SIM PMKP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 4px 6px rgba(0,0,0,.05); border-radius: 8px; border-top: 4px solid #6f42c1; background: #fff;}
        .table-custom th { background-color: #2c3e50; color: white; vertical-align: middle; }
        .table-custom td { vertical-align: middle; }
        .bg-sudah { background-color: #d1e7dd; color: #0f5132; font-weight: bold; }
        .bg-belum { background-color: #f8d7da; color: #842029; font-weight: bold; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4">
        <div class="bg-white p-4 mb-4 card-custom">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <div>
                    <h4 class="mb-1 text-dark fw-bold"><i class="fas fa-radar text-primary me-2"></i> Radar Kepatuhan Unit</h4>
                    <p class="text-muted mb-0">Pantau unit mana yang sudah/belum menyetor data indikator mutu bulanan.</p>
                </div>
            </div>

            <div class="row bg-light p-3 mb-4 rounded border align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-bold text-secondary mb-1">Bulan</label>
                    <select id="filterBulan" class="form-select border-primary fw-bold">
                        <option value="1">Januari</option><option value="2">Februari</option>
                        <option value="3">Maret</option><option value="4">April</option>
                        <option value="5">Mei</option><option value="6">Juni</option>
                        <option value="7">Juli</option><option value="8">Agustus</option>
                        <option value="9">September</option><option value="10">Oktober</option>
                        <option value="11">November</option><option value="12">Desember</option>
                    </select>
                </div>
                <div class="col-md-2 mt-3 mt-md-0">
                    <label class="form-label fw-bold text-secondary mb-1">Tahun</label>
                    <select id="filterTahun" class="form-select border-primary fw-bold"></select>
                </div>
                <div class="col-md-3 mt-3 mt-md-0">
                    <button class="btn btn-primary fw-bold w-100" onclick="tarikDataKepatuhan()">
                        <i class="fas fa-search me-2"></i> Pindai Radar
                    </button>
                </div>
                <div class="col-md-4 mt-3 mt-md-0 text-md-end">
                    <span id="rekapStatus" class="fw-bold fs-5"></span>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-hover table-custom" id="tabelKepatuhan">
                    <thead>
                        <tr>
                            <th width="5%" class="text-center">No</th>
                            <th width="20%">Nama Unit Pelapor</th>
                            <th width="35%">Daftar Indikator Wajib</th>
                            <th width="15%" class="text-center">Status</th>
                            <th width="25%" class="text-center">Aksi Penagihan</th>
                        </tr>
                    </thead>
                    <tbody id="bodyKepatuhan">
                        <tr><td colspan="5" class="text-center text-muted py-4">Silakan klik "Pindai Radar" untuk melihat data.</td></tr>
                    </tbody>
                </table>
            </div>
            
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Set Default Filter ke Bulan & Tahun Saat Ini
        document.addEventListener("DOMContentLoaded", function() {
            const date = new Date();
            document.getElementById('filterBulan').value = date.getMonth() + 1;
            
            const dropdownTahun = document.getElementById('filterTahun');
            const thn = date.getFullYear();
            dropdownTahun.add(new Option(thn, thn));
            dropdownTahun.add(new Option(thn - 1, thn - 1));
            dropdownTahun.value = thn;

            tarikDataKepatuhan(); // Otomatis jalan saat halaman dibuka
        });

        function tarikDataKepatuhan() {
            const bln = document.getElementById('filterBulan').value;
            const thn = document.getElementById('filterTahun').value;
            const tbody = document.getElementById('bodyKepatuhan');
            
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-5"><i class="fas fa-radar fa-spin text-primary fs-2 mb-3 d-block"></i> Memindai database...</td></tr>';
            
            // GANTI API_CONFIG.MUTU SESUAI NAMA VARIABEL DI config.js ANDA
            const scriptURL = typeof API_CONFIG !== 'undefined' ? API_CONFIG.MUTU : ""; 

            const payload = {
                action: "cek_kepatuhan",
                bulan: bln,
                tahun: thn
            };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success') {
                    renderTabel(res.data, bln, thn);
                } else {
                    Swal.fire('Gagal', res.message, 'error');
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Gagal memuat data.</td></tr>';
                }
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Network Error. Periksa URL API.</td></tr>';
            });
        }

        function renderTabel(data, bln, thn) {
            const tbody = document.getElementById('bodyKepatuhan');
            tbody.innerHTML = '';
            
            let jmlSudah = 0;
            let jmlBelum = 0;
            
            const namaBulan = document.getElementById('filterBulan').options[document.getElementById('filterBulan').selectedIndex].text;

            data.forEach((row, index) => {
                let isSudah = row.status === "SUDAH";
                if(isSudah) jmlSudah++; else jmlBelum++;
                
                let badgeStatus = isSudah 
                    ? `<span class="badge bg-success rounded-pill px-3 py-2"><i class="fas fa-check-circle me-1"></i> Telah Mengisi</span>`
                    : `<span class="badge bg-danger rounded-pill px-3 py-2 blink-me"><i class="fas fa-times-circle me-1"></i> Belum Mengisi</span>`;
                
                let classRow = isSudah ? 'bg-sudah' : 'bg-belum';
                
                let waOri = row.wa ? row.wa.toString().replace(/[^0-9]/g, '') : "";
                if(waOri.startsWith("08")) waOri = "62" + waOri.substring(1);
                
                // === DI SINI LOGIKA DAFTAR INDIKATORNYA ===
                let listIndikatorHTML = '<ul class="list-unstyled mb-0" style="text-align: left;">';
                let daftarIndikatorBelum = []; 
                
                if (row.detail_indikator && row.detail_indikator.length > 0) {
                    row.detail_indikator.forEach(ind => {
                        if (ind.status) {
                            // Jika terisi -> Centang Hijau
                            listIndikatorHTML += `<li class="text-success fw-bold mb-1"><i class="fas fa-check-circle me-2"></i>${ind.nama}</li>`;
                        } else {
                            // Jika belum terisi -> Silang Merah (Teks dicoret)
                            listIndikatorHTML += `<li class="text-danger fw-bold mb-1"><i class="fas fa-times-circle me-2"></i><span style="text-decoration: line-through; opacity: 0.7;">${ind.nama}</span></li>`;
                            daftarIndikatorBelum.push("- " + ind.nama); 
                        }
                    });
                } else {
                    listIndikatorHTML += `<li>${row.indikator}</li>`; 
                }
                listIndikatorHTML += '</ul>';
                
                // Tombol Tagihan Spesifik
                let drafPesanText = `⚠️ *PEMBERITAHUAN KOMITE MUTU*\n\nYth. PIC Mutu *${row.unit}*,\nSistem mendeteksi unit Anda *BELUM* menyelesaikan pengisian indikator mutu untuk bulan *${namaBulan} ${thn}* pada formulir berikut:\n\n${daftarIndikatorBelum.join("\n")}\n\nMohon segera diselesaikan hari ini. Terima kasih.`;
                let drafPesan = encodeURIComponent(drafPesanText);
                
                let btnAksi = "";
                if (isSudah && daftarIndikatorBelum.length === 0) {
                    btnAksi = `<span class="text-success fw-bold"><i class="fas fa-check-double"></i> Tuntas 100%</span>`;
                } else {
                    if (waOri) {
                        let btnColor = isSudah ? 'btn-warning text-dark' : 'btn-success'; 
                        let btnText = isSudah ? '<i class="fab fa-whatsapp me-1"></i> Tagih Sisanya' : '<i class="fab fa-whatsapp me-1"></i> Tagih via WA';
                        btnAksi = `<a href="https://wa.me/${waOri}?text=${drafPesan}" target="_blank" class="btn btn-sm ${btnColor} fw-bold w-100 shadow-sm mt-2">${btnText}</a>`;
                    } else {
                        btnAksi = `<button class="btn btn-sm btn-secondary w-100 mt-2" disabled>No WA Kosong</button>`;
                    }
                }

                tbody.innerHTML += `
                    <tr>
                        <td class="text-center fw-bold">${index + 1}</td>
                        <td class="fw-bold">${row.unit}</td>
                        <td style="font-size: 0.85rem;" class="text-muted">${listIndikatorHTML}</td>
                        <td class="text-center ${classRow}">${badgeStatus}</td>
                        <td class="text-center align-middle">${btnAksi}</td>
                    </tr>
                `;
            });

            document.getElementById('rekapStatus').innerHTML = `
                <span class="text-success me-3"><i class="fas fa-check-circle"></i> Patuh: ${jmlSudah}</span>
                <span class="text-danger"><i class="fas fa-exclamation-triangle"></i> Nunggak: ${jmlBelum}</span>
            `;
        }
    </script>
</body>
</html>
