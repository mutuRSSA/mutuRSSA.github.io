<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Validasi Mutu - SIM PMKP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f0f2f5; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 4px 12px rgba(0,0,0,.05); border-radius: 12px; border: none; background: #fff;}
        .table-custom th { background-color: #2c3e50; color: white; font-size: 0.85rem; border: none; padding: 12px 10px; text-transform: uppercase; letter-spacing: 0.5px;}
        .table-custom td { vertical-align: middle; font-size: 0.85rem; border-bottom: 1px solid #f1f3f5; padding: 10px; }
        
        .status-valid { color: #198754; font-weight: bold; }
        .status-invalid { color: #dc3545; font-weight: bold; }

        @media print {
            body { background-color: #fff !important; padding-top: 0 !important; }
            #navbar-container, #sidebar-container, .d-print-none, .btn { display: none !important; }
            .card-custom { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .table-custom th { background-color: #f8f9fa !important; color: #000 !important; border: 1px solid #000 !important; }
            .table-custom td { border: 1px solid #000 !important; color: #000 !important; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { margin: 1cm; size: landscape; }
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4" style="max-width: 1400px;">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3 d-print-none">
            <div>
                <h3 class="mb-1 text-dark fw-bold"><i class="fas fa-file-signature text-primary me-2"></i> Laporan Validasi Data Mutu</h3>
                <p class="text-muted mb-0">Arsip riwayat validasi indikator dan cetak Berita Acara.</p>
            </div>
            <div class="d-flex gap-2">
                <a href="validasi_mutu.html" class="btn btn-outline-success fw-bold shadow-sm rounded-pill px-4">
                    <i class="fas fa-plus me-2"></i> Validasi Baru
                </a>
                <button class="btn btn-danger fw-bold shadow-sm rounded-pill px-4" onclick="window.print()">
                    <i class="fas fa-file-pdf me-2"></i> Cetak / PDF
                </button>
                <button class="btn text-white fw-bold shadow-sm rounded-pill px-4" style="background-color: #0d6efd;" onclick="exportKeWord()">
                    <i class="fas fa-file-word me-2"></i> Export ke Word
                </button>
            </div>
        </div>

        <div class="card-custom p-4 shadow-sm border-top border-4 border-primary">
            
            <div class="row g-3 mb-4 d-print-none align-items-end">
                <div class="col-md-2">
                    <label class="form-label fw-bold text-secondary mb-1" style="font-size:0.85rem;">Filter Tahun</label>
                    <select id="filterTahun" class="form-select border-primary fw-bold text-dark" onchange="renderTabel()"></select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-bold text-secondary mb-1" style="font-size:0.85rem;">Filter Bulan</label>
                    <select id="filterBulan" class="form-select border-primary fw-bold text-dark" onchange="renderTabel()">
                        <option value="ALL">Semua Bulan</option>
                        <option value="Januari">Januari</option><option value="Februari">Februari</option>
                        <option value="Maret">Maret</option><option value="April">April</option>
                        <option value="Mei">Mei</option><option value="Juni">Juni</option>
                        <option value="Juli">Juli</option><option value="Agustus">Agustus</option>
                        <option value="September">September</option><option value="Oktober">Oktober</option>
                        <option value="November">November</option><option value="Desember">Desember</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold text-secondary mb-1" style="font-size:0.85rem;">Pencarian Bebas</label>
                    <input type="text" class="form-control border-primary" id="searchKeyword" placeholder="Cari indikator, unit, atau validator..." onkeyup="renderTabel()">
                </div>
            </div>

            <div id="loadingMessage" class="text-center py-5">
                <i class="fas fa-circle-notch fa-spin fa-3x text-primary mb-3"></i>
                <h6 class="text-muted">Mengambil rekam jejak validasi...</h6>
            </div>

            <div id="areaCetakLaporan" class="d-none">
                
                <div class="text-center mb-4 border-bottom border-dark border-3 pb-3">
                    <h3 class="fw-bold mb-1">BERITA ACARA VALIDASI INDIKATOR MUTU</h3>
                    <h5 class="fw-bold text-uppercase mb-0">RSUD SARAS ADYATMA</h5>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover table-custom table-bordered" id="tabelValidasi">
                        <thead>
                            <tr>
                                <th width="3%" class="text-center">No</th>
                                <th width="10%">Tgl Validasi</th>
                                <th width="20%">Judul Indikator</th>
                                <th width="10%">Unit Kerja</th>
                                <th width="7%" class="text-center">Periode</th>
                                <th width="6%" class="text-center">N</th>
                                <th width="6%" class="text-center">n</th>
                                <th width="7%" class="text-center text-warning">Unit (A)</th>
                                <th width="7%" class="text-center text-info">Valid (B)</th>
                                <th width="6%" class="text-center">Akurasi</th>
                                <th width="8%" class="text-center">Status</th>
                                <th width="10%">Validator</th>
                            </tr>
                        </thead>
                        <tbody id="bodyValidasi"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const MUTU_URL = typeof API_CONFIG !== 'undefined' ? API_CONFIG.MUTU : "";
        const session = JSON.parse(localStorage.getItem("sessionMutu")) || {};
        let rawDataValidasi = [];

        document.addEventListener("DOMContentLoaded", function () {
            const yearSelect = document.getElementById('filterTahun');
            const currentYear = new Date().getFullYear();
            yearSelect.add(new Option("Semua Tahun", "ALL"));
            yearSelect.add(new Option(currentYear, currentYear));
            yearSelect.add(new Option(currentYear - 1, currentYear - 1));
            yearSelect.value = currentYear;

            loadDataValidasi();
        });

        function loadDataValidasi() {
            if (!MUTU_URL) return;

            fetch(MUTU_URL + "?action=get_validasi")
            .then(res => res.json())
            .then(res => {
                document.getElementById('loadingMessage').classList.add('d-none');
                if (res.status === 'success') {
                    rawDataValidasi = res.data;
                    renderTabel();
                    document.getElementById('areaCetakLaporan').classList.remove('d-none');
                } else {
                    Swal.fire('Gagal!', 'Gagal mengambil data validasi.', 'error');
                }
            })
            .catch(err => {
                document.getElementById('loadingMessage').classList.add('d-none');
                Swal.fire('Error', 'Gagal menyambung ke server.', 'error');
            });
        }

        function renderTabel() {
            const filterThn = document.getElementById('filterTahun').value;
            const filterBln = document.getElementById('filterBulan').value;
            const keyword = document.getElementById('searchKeyword').value.toLowerCase();
            
            const tbody = document.getElementById('bodyValidasi');
            tbody.innerHTML = '';

            let filteredData = rawDataValidasi.filter(row => {
                let matchThn = filterThn === "ALL" || row["Tahun"] == filterThn;
                let matchBln = filterBln === "ALL" || row["Bulan"] === filterBln;
                let textData = JSON.stringify(row).toLowerCase();
                let matchKey = keyword === "" || textData.includes(keyword);
                return matchThn && matchBln && matchKey;
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="text-center py-4 text-muted">Data validasi tidak ditemukan untuk filter ini.</td></tr>';
                return;
            }

            filteredData.forEach((row, idx) => {
                let isValid = row["Status Validasi"] === "VALID";
                let statusIcon = isValid ? '<i class="fas fa-check-circle text-success d-print-none"></i>' : '<i class="fas fa-exclamation-triangle text-danger d-print-none"></i>';
                let statusClass = isValid ? 'status-valid' : 'status-invalid';

                tbody.innerHTML += "<tr>" +
                    "<td class='text-center text-muted fw-bold'>" + (idx + 1) + "</td>" +
                    "<td>" + (row["Tgl Validasi"] || "-") + "</td>" +
                    "<td class='fw-bold'>" + (row["Indikator"] || "-") + "</td>" +
                    "<td>" + (row["Unit"] || "-") + "</td>" +
                    "<td class='text-center'><span class='badge bg-light text-dark border'>" + (row["Bulan"] || "-") + " " + (row["Tahun"] || "-") + "</span></td>" +
                    "<td class='text-center fw-bold text-secondary'>" + (row["Populasi (N)"] || "-") + "</td>" +
                    "<td class='text-center fw-bold text-primary'>" + (row["Sampel (n)"] || "-") + "</td>" +
                    "<td class='text-center fw-bold text-warning' style='background-color: #fffdf5;'>" + (row["Capaian Total (A)"] || "0") + "</td>" +
                    "<td class='text-center fw-bold text-info' style='background-color: #f5fcfd;'>" + (row["Capaian Sampel (B)"] || "0") + "</td>" +
                    "<td class='text-center fw-bold'>" + (row["Akurasi (%)"] || "0") + "%</td>" +
                    "<td class='text-center " + statusClass + "'>" + statusIcon + " " + (row["Status Validasi"] || "-") + "</td>" +
                    "<td class='text-muted fw-bold' style='font-size: 0.75rem;'>" + (row["Validator"] || "-") + "</td>" +
                "</tr>";
            });
        }

        // FITUR BARU: GENERATOR MICROSOFT WORD
        window.exportKeWord = function() {
            const content = document.getElementById('areaCetakLaporan').cloneNode(true);
            content.classList.remove('d-none');
            
            const noPrintElements = content.querySelectorAll('.d-print-none');
            noPrintElements.forEach(el => el.remove());

            const h1 = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><style>";
            
            // PERBAIKAN UTAMA: Menggunakan string sebaris dan operator tambah (+) untuk menghindari "unescaped line break"
            const h2 = "body { font-family: 'Segoe UI', Arial, sans-serif; } " +
                       "table { border-collapse: collapse; width: 100%; margin-bottom: 20px; border: 1px solid #000; } " +
                       "th, td { border: 1px solid #000; padding: 6px; font-size: 9pt; vertical-align: middle; } " +
                       "th { background: #f2f2f2; font-weight: bold; text-align: center; } " +
                       ".text-center { text-align: center; } " +
                       ".fw-bold { font-weight: bold; } " +
                       ".status-valid { color: #198754; font-weight: bold; text-align: center; } " +
                       ".status-invalid { color: #dc3545; font-weight: bold; text-align: center; } " +
                       "h3, h5 { text-align: center; margin: 5px 0; } " +
                       ".text-uppercase { text-transform: uppercase; }";
            
            // PERBAIKAN UTAMA: Memecah string tag penutup agar browser tidak memotong eksekusi JavaScript secara paksa
            const h3 = "</" + "style></" + "head><body>";
            const f1 = "</" + "body></" + "html>";
                
            const blob = new Blob(['\ufeff', h1 + h2 + h3 + content.innerHTML + f1], { type: 'application/msword' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob); 
            link.download = "Laporan_Validasi_Mutu_" + document.getElementById('filterBulan').value + "_" + document.getElementById('filterTahun').value + ".doc";
            link.click();
        };
    </script>
</body>
</html>
