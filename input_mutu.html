<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Laporan Mutu</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hyperformula/dist/hyperformula.full.min.js"></script>

    <style>
    /* CSS Standar Halaman */
    body { background-color: #f4f6f9; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
    .card-custom { box-shadow: 0 4px 12px rgba(0,0,0,.04); border-radius: 12px; border-top: 4px solid #0dcaf0; background: #fff;}
    
    /* =======================================================
       TEMA HANDSONTABLE: ANTI BLOK HITAM & BERSIH
       ======================================================= */
    .handsontable {
        font-family: 'Segoe UI', Tahoma, sans-serif !important;
        font-size: 13px !important;
        color: #495057 !important;
        box-shadow: none !important; 
        background-color: #ffffff !important;
    }

    /* Paksa seluruh wadah dan area kosong menjadi putih murni */
    .handsontable .wtHolder, 
    .handsontable .wtHider, 
    .ht_master, 
    .ht_clone_left, 
    .ht_clone_top, 
    .ht_clone_top_left_corner {
        background-color: #ffffff !important;
        background: #ffffff !important;
    }

    /* FIX: Memastikan teks saat mengetik (Edit Mode) terlihat jelas */
    .handsontableInput {
        color: #2c3e50 !important;
        background-color: #ffffff !important;
        font-size: 13px !important;
        box-shadow: 0 0 0 2px #0dcaf0 !important; /* Efek fokus biru saat mengetik */
        padding: 4px !important;
    }

    /* FIX: Pastikan class readonly bawaan tidak berubah jadi hitam */
    .handsontable .htDimmed {
        background-color: #f1f3f5 !important;
        color: #495057 !important;
    }

    /* Warna Header */
    .handsontable th {
        background-color: #f8f9fa !important; 
        color: #495057 !important;            
        font-weight: 600 !important;
        border-color: #dee2e6 !important;     
        text-align: center;
        vertical-align: middle !important;
        padding: 10px 5px !important;
        white-space: normal !important;
    }

    /* Aksen Garis Biru Info di Bawah Header Kolom */
    .handsontable thead th {
        border-bottom: 2px solid #0dcaf0 !important;
    }

    /* Garis Antar Sel yang Sangat Halus */
    .handsontable td {
        border-color: #e9ecef !important;
        vertical-align: middle !important;
        padding: 6px 10px !important;
    }

    /* Area yang DI-BLOK/DIPILIH */
    .handsontable .wtBorder.current, .handsontable .wtBorder.area {
        background-color: #0dcaf0 !important; 
    }
    .handsontable td.area {
        background-color: rgba(13, 202, 240, 0.08) !important; 
    }

    /* Styling Tab Navigation */
    .nav-tabs .nav-link.active { border-top: 3px solid #0dcaf0; font-weight: bold; color: #2c3e50; background-color: #fff; border-bottom: none;}
    .nav-tabs .nav-link { color: #6c757d; font-size: 0.9rem; border: none; margin-right: 5px; }
    .nav-tabs { border-bottom: 2px solid #dee2e6; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4">
        
        <ul class="nav nav-tabs mb-3" id="formTabs"></ul>

        <div class="bg-white p-4 mb-4 card-custom">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <div>
                    <h4 class="mb-1 text-dark fw-bold" id="judulForm"><i class="fas fa-edit text-info me-2"></i> Input Data Observasi Mutu</h4>
                    <p class="text-muted mb-0 fw-bold text-uppercase" id="subJudulForm">Memuat formulir...</p>
                </div>
                <div>
                    <span class="badge bg-secondary fs-6" id="badgeUnit"><i class="fas fa-hospital me-1"></i> Unit...</span>
                </div>
            </div>

            <div id="loadingMessage" class="alert alert-info text-center fw-bold shadow-sm">
                <i class="fas fa-spinner fa-spin me-2"></i> Sinkronisasi database...
            </div>
            
            <div id="spreadsheetContainer" style="display: none;">
                <div id="spreadsheet" class="mb-4 w-100 hot"></div>

                <div class="d-flex justify-content-between bg-light p-3 border rounded align-items-center mt-3">
                    <small class="text-muted">
                        <i class="fas fa-info-circle me-1"></i> Data status <strong>"Final"</strong> dikunci permanen.<br>
                        Gunakan status <strong>"Draft"</strong> jika masih ingin diedit di kemudian waktu.
                    </small>
                    <button class="btn btn-success fw-bold px-4 shadow-sm" onclick="simpanDataMentah()" id="btnSimpan">
                        <i class="fas fa-cloud-upload-alt me-2"></i> Simpan Laporan
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbw2nBiM7lILqUC-sxGsloXsn5v2amDFWugMjUN8qR6wF1ZFCBObrOA1qkH2V1E9KSPh/exec";
        
        let hot = null; 
        let activeFormType = new URLSearchParams(window.location.search).get('form');
        
        if (!activeFormType) { window.location.href = "index.html"; }
        
        const sessionMutu = JSON.parse(localStorage.getItem("sessionMutu")) || {};
        const userUnit = sessionMutu.unit || "GUEST";

        const colToLetter = (index) => {
            let letter = '';
            while (index >= 0) {
                letter = String.fromCharCode((index % 26) + 65) + letter;
                index = Math.floor(index / 26) - 1;
            }
            return letter;
        };

        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById('badgeUnit').innerHTML = `<i class="fas fa-hospital me-1"></i> ${userUnit}`;
            document.getElementById('subJudulForm').innerText = `FORMULIR: ${activeFormType.replace(/_/g, ' ')}`;

            fetch(`${scriptURL}?unit=${encodeURIComponent(userUnit)}&formType=${encodeURIComponent(activeFormType)}`)
                .then(res => res.json())
                .then(result => {
                    document.getElementById('loadingMessage').style.display = 'none';

                    if (result.status === 'success') {
                        let tabsHtml = '';
                        result.menu.forEach(form => {
                            let isActive = (form === activeFormType) ? 'active' : '';
                            tabsHtml += `
                                <li class="nav-item">
                                    <a class="nav-link ${isActive}" href="input_mutu.html?form=${form}">
                                        <i class="fas ${isActive ? 'fa-folder-open text-info' : 'fa-folder'} me-1"></i> ${form.replace(/_/g, ' ')}
                                    </a>
                                </li>`;
                        });
                        document.getElementById('formTabs').innerHTML = tabsHtml;

                        // Penerjemah Rumus
                        result.data.forEach((row, rowIndex) => {
                            result.columns.forEach((col, colIndex) => {
                                if (col.formula && col.formula.trim() !== "") {
                                    let excelFormula = col.formula
                                        .replace(/\[(\d+):(\d+)\]/g, (m, s, e) => colToLetter(parseInt(s)) + (rowIndex + 1) + ":" + colToLetter(parseInt(e)) + (rowIndex + 1))
                                        .replace(/\[(\d+)\]/g, (m, idx) => colToLetter(parseInt(idx)) + (rowIndex + 1));
                                    
                                    row[colIndex] = excelFormula.startsWith('=') ? excelFormula : "=" + excelFormula;
                                }
                            });
                        });

                        let hotColumns = result.columns.map(c => {
                        // Gunakan tipe dari backend, jika kosong jadikan text
                        let config = { type: c.type || 'text', readOnly: c.readOnly || false };
                        
                        if (c.type === 'dropdown') {
                            config.source = c.source;
                        } 
                        else if (c.type === 'checkbox') {
                            // Ubah output centang menjadi Ya/Tidak agar rumus Excel Anda tetap berfungsi
                            config.checkedTemplate = 'Ya';
                            config.uncheckedTemplate = 'Tidak';
                            config.className = 'htCenter htMiddle'; // Buat letak kotak centang rapi di tengah
                        }
                        
                        return config;
                    });

                        document.getElementById('spreadsheetContainer').style.display = 'block';
                        
                        const container = document.getElementById('spreadsheet');
                        hot = new Handsontable(container, {
                            data: result.data,
                            colHeaders: result.columns.map(c => c.title),
                            columns: hotColumns,
                            rowHeaders: true,
                            width: '100%',
                            height: 'auto', 
                            viewportRowRenderingOffset: 100, 
                            minSpareRows: 3,
                            contextMenu: true,
                            formulas: {
                                engine: HyperFormula, 
                            },
                            licenseKey: 'non-commercial-and-evaluation', 
                            
                            cells: function(row, col) {
                                var cellProperties = {};
                                cellProperties.renderer = function(instance, td, r, c, prop, value, cellProps) {
                                    Handsontable.renderers.TextRenderer.apply(this, arguments);
                                    
                                    let statusColIndex = instance.getSettings().columns.length - 1;
                                    let status = instance.getDataAtCell(r, statusColIndex);
                                    
                                    // Reset gaya default
                                    td.style.fontStyle = 'normal';
                                    td.style.fontWeight = 'normal';

                                    // Logika Pewarnaan Baru
                                    if (status === 'Final') {
                                        td.style.backgroundColor = '#e9ecef'; 
                                        td.style.color = '#adb5bd';
                                        td.style.fontStyle = 'italic';
                                    } 
                                    else if (cellProps.readOnly) {
                                        td.style.backgroundColor = '#f1f3f5'; // Abu-abu terang & stabil
                                        td.style.color = '#0dcaf0';           // Aksen teks cyan
                                        td.style.fontWeight = 'bold';
                                    } 
                                    else {
                                        td.style.backgroundColor = '#ffffff'; 
                                        td.style.color = '#2c3e50';           
                                    }

                                    // Penyelarasan teks
                                    if (!isNaN(value) && value !== "" && value !== null) {
                                        td.style.textAlign = 'right';
                                    } else {
                                        td.style.textAlign = 'left';
                                    }
                                    
                                    // Bersihkan error rumus
                                    if (value === '#DIV/0!' || value === '#VALUE!' || value === '#CYCLE!') {
                                        td.innerHTML = '<span style="color:#dee2e6">-</span>';
                                    } 
                                };
                                return cellProperties;
                            },

                            beforeChange: function (changes, source) {
                                if (source === 'loadData' || !changes) return;
                                
                                let statusColIndex = this.getSettings().columns.length - 1;
                                let isBlocked = false;

                                changes.forEach(change => {
                                    let row = change[0];
                                    let col = change[1];
                                    let status = this.getDataAtCell(row, statusColIndex);
                                    
                                    if (status === 'Final' && col !== statusColIndex) {
                                        change[3] = change[2]; 
                                        isBlocked = true;
                                    }
                                });

                                if(isBlocked) alert("Tindakan dibatalkan. Baris ini telah berstatus Final.");
                            }
                        });
                    } else {
                        document.getElementById('loadingMessage').innerHTML = `<i class="fas fa-lock me-2"></i> ${result.message}`;
                    }
                });
        });

        window.simpanDataMentah = function() {
            if (!hot) return;
            const btn = document.getElementById('btnSimpan');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i> Menyimpan...`;
            btn.disabled = true;

            const rawData = hot.getData();
            const dataToSave = rawData.filter(row => row.some(cell => cell !== null && cell !== ""));
            const headers = hot.getColHeader(); 

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                    action: 'save_raw_data',
                    formType: activeFormType,
                    unit: userUnit,
                    data: [headers, ...dataToSave]
                })
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success') {
                    alert("✅ Data berhasil disimpan!");
                    window.location.reload();
                } else { alert("❌ Gagal: " + res.message); }
            })
            .finally(() => {
                btn.innerHTML = `<i class="fas fa-cloud-upload-alt me-2"></i> Simpan Laporan`;
                btn.disabled = false;
            });
        };
    </script>
</body>
</html>
