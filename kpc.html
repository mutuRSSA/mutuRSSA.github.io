<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir KPC - SIM PMKP</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #f4f6f9; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 4px 12px rgba(0,0,0,.04); border-radius: 12px; border-top: 4px solid #ffc107; background: #fff;}
        
        .kpc-banner { 
            background: linear-gradient(135deg, #fff3cd 0%, #ffe69c 100%); 
            color: #664d03; border-radius: 8px; padding: 20px; margin-bottom: 25px; border: 1px solid #ffecb5; 
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4" style="max-width: 900px;">
        <div class="bg-white p-4 mb-4 card-custom">
            
            <div class="kpc-banner d-flex align-items-center gap-3 flex-wrap">
                <i class="fas fa-exclamation-triangle fa-3x text-warning d-none d-sm-block"></i>
                <div>
                    <h4 class="fw-bold mb-1"><i class="fas fa-exclamation-triangle text-warning me-2 d-inline d-sm-none"></i> Formulir Pelaporan KPC</h4>
                    <p class="mb-0" style="font-size:0.9rem;">Kondisi Potensial Cedera (KPC) adalah kondisi yang berpotensi menimbulkan harm/cedera pada pasien, namun <b>belum terjadi insiden</b>. Laporkan segera untuk memicu langkah pencegahan!</p>
                </div>
            </div>

            <form id="formKPC">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="fw-bold mb-1 text-secondary">Lokasi / Unit Penemuan <span class="text-danger">*</span></label>
                        <input type="text" class="form-control border-secondary" id="inp_lokasi" required placeholder="Contoh: Selasar IGD, Ruang Tunggu Farmasi...">
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold mb-1 text-secondary">Waktu Ditemukan KPC <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control border-secondary" id="inp_waktu" required>
                    </div>

                    <div class="col-12 mt-4">
                        <label class="fw-bold mb-1 text-dark">Deskripsi Kondisi Potensial Cedera (KPC) <span class="text-danger">*</span></label>
                        <textarea class="form-control border-dark" id="inp_deskripsi" rows="3" required placeholder="Jelaskan secara detail kondisi fisik/sistem berbahaya yang Anda temukan..."></textarea>
                    </div>

                    <div class="col-12 mt-3">
                        <label class="fw-bold mb-1 text-secondary"><i class="fas fa-camera me-1"></i> Bukti Foto Kondisi KPC <small class="text-muted fw-normal">(Opsional, Maks 2MB)</small></label>
                        <input type="file" class="form-control" id="inp_foto" accept="image/*" onchange="previewImage(event)">
                        
                        <div class="mt-3 text-center d-none bg-light p-2 border rounded" id="previewContainer">
                            <img id="imgPreview" src="" class="img-thumbnail shadow-sm" style="max-height: 250px; object-fit: contain;">
                            <button type="button" class="btn btn-sm btn-outline-danger mt-2 d-block mx-auto fw-bold" onclick="hapusFoto()"><i class="fas fa-trash me-1"></i> Hapus Lampiran Foto</button>
                        </div>
                    </div>

                    <div class="col-12 mt-3">
                        <label class="fw-bold mb-1 text-dark">Tindakan yang Telah Dilakukan (Seketika) <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="inp_tindakan_segera" rows="2" required placeholder="Apa yang langsung Anda amankan atau lakukan saat itu juga?"></textarea>
                    </div>

                    <div class="col-12 mt-4 p-3 bg-light border rounded">
                        <h6 class="fw-bold text-primary mb-3"><i class="fas fa-lightbulb me-2"></i> Saran Rencana Perbaikan <small class="text-muted fw-normal ms-2">(Opsional, namun akan diteruskan ke Papan Kerja)</small></h6>
                        
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="fw-bold mb-1" style="font-size: 0.9rem;">Tindakan Pencegahan Lanjutan (Usulan)</label>
                                <textarea class="form-control border-primary" id="inp_tindakan_lanjutan" rows="2" placeholder="Saran perbaikan sistem atau fasilitas agar kondisi ini benar-benar tuntas..."></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="fw-bold mb-1" style="font-size: 0.9rem;">Penanggung Jawab (PIC)</label>
                                <input type="text" class="form-control" id="inp_pic" placeholder="Nama / Jabatan Pelaksana">
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1" style="font-size: 0.9rem;">Target Tanggal (Tenggat)</label>
                                <input type="date" class="form-control" id="inp_tenggat">
                            </div>
                        </div>
                    </div>

                    <hr class="mt-4 mb-2 text-muted">

                    <div class="col-md-6">
                        <label class="fw-bold mb-1 text-secondary">Nama Pelapor <small class="text-muted fw-normal">(Opsional)</small></label>
                        <input type="text" class="form-control" id="inp_pelapor" placeholder="Boleh dikosongkan (Anonim) jika ragu">
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light border fw-bold" onclick="resetForm()"><i class="fas fa-undo me-1"></i> Reset</button>
                    <button type="submit" class="btn btn-warning fw-bold text-dark shadow-sm" id="btnSubmit">
                        <i class="fas fa-paper-plane me-2"></i> Kirim Laporan KPC
                    </button>
                </div>
            </form>

        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let base64LampiranFoto = ""; 
        let namaFileFoto = "";

        document.addEventListener("DOMContentLoaded", function () {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('inp_waktu').value = now.toISOString().slice(0, 16);

            const sessionStr = localStorage.getItem("sessionMutu");
            if (sessionStr) {
                const userData = JSON.parse(sessionStr);
                document.getElementById('inp_pelapor').value = userData.username;
            }
        });

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                if(file.size > 2097152) {
                    Swal.fire('Ukuran Terlalu Besar!', 'Batas maksimal ukuran foto adalah 2 MB agar server tidak menolak kiriman. Silakan kompres atau pilih foto lain.', 'warning');
                    hapusFoto();
                    return;
                }

                namaFileFoto = "KPC_" + new Date().getTime() + "_" + file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64LampiranFoto = e.target.result;
                    document.getElementById('imgPreview').src = base64LampiranFoto;
                    document.getElementById('previewContainer').classList.remove('d-none');
                }
                reader.readAsDataURL(file);
            }
        }

        function hapusFoto() {
            document.getElementById('inp_foto').value = "";
            base64LampiranFoto = "";
            namaFileFoto = "";
            document.getElementById('previewContainer').classList.add('d-none');
            document.getElementById('imgPreview').src = "";
        }

        function resetForm() {
            document.getElementById('formKPC').reset();
            hapusFoto();
        }

        document.getElementById('formKPC').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Mengirim...';
            btn.disabled = true;

            // Menggunakan kamus mapping dari backend Anda
            const payloadData = {
                "tgl_waktu": document.getElementById('inp_waktu').value,
                "lokasi": document.getElementById('inp_lokasi').value.trim(),
                "deskripsi": document.getElementById('inp_deskripsi').value.trim(),
                "tindakan": document.getElementById('inp_tindakan_segera').value.trim(),
                "nama_pelapor": document.getElementById('inp_pelapor').value.trim() || "Anonim",
                
                // Variabel khusus jika ingin mengunggah foto ke Google Drive
                "fileData": base64LampiranFoto,
                "fileName": namaFileFoto,

                // Rencana Tindakan (CAPA) yang diusulkan pelapor
                "tindakan_akan_dilakukan": document.getElementById('inp_tindakan_lanjutan').value.trim(),
                "pj_tindakan": document.getElementById('inp_pic').value.trim(),
                "tgl_tindakan": document.getElementById('inp_tenggat').value,
                "Status KPC": "Open" 
            };

            // Jika session ada, tarik data unit pelapor
            const sessionStr = localStorage.getItem("sessionMutu");
            if (sessionStr) {
                const userData = JSON.parse(sessionStr);
                payloadData["unit_pelapor"] = userData.unit;
            } else {
                payloadData["unit_pelapor"] = "Tidak Diketahui";
            }

            const payload = {
                action: 'create',
                data: payloadData
            };

            fetch(API_CONFIG.KPC, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    Swal.fire({
                        title: 'Terkirim!',
                        text: 'Laporan KPC berhasil dikirim ke Komite Mutu.',
                        icon: 'success',
                        confirmButtonColor: '#ffc107',
                        confirmButtonText: 'Tutup'
                    }).then(() => {
                        window.location.reload();
                    });
                } else {
                    Swal.fire('Gagal!', res.message, 'error');
                    resetBtn();
                }
            })
            .catch(err => {
                Swal.fire('Koneksi Terputus', 'Gagal menyambung ke server database.', 'error');
                resetBtn();
            });

            function resetBtn() {
                btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> Kirim Laporan KPC';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
