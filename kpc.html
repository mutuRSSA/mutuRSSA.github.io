<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir KPC - Komite Mutu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #f4f6f9; 
            padding-top: 80px; /* Jarak untuk header fixed */
            padding-bottom: 40px; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        .card-custom { box-shadow: 0 0 1px rgba(0,0,0,.125), 0 1px 3px rgba(0,0,0,.2); border-radius: 4px; border-top: 3px solid #ffc107; /* Warna Kuning untuk KPC */ }
        
        /* Tema Header dan Sidebar */
        .bg-custom-dark { background-color: #3c8dbc; } 
        .sidebar-link.active { background-color: #f4f6f9; color: #3c8dbc; border-left: 4px solid #3c8dbc; font-weight: bold; }
        .sidebar-link { color: #333; font-weight: 500; transition: 0.2s; }
        .sidebar-link:hover { background-color: #e9ecef; }
        .navbar-brand { font-size: 1.25rem; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container" style="max-width: 900px;">
        <div class="bg-white p-4 card-custom">
            <h4 class="mb-2 text-dark fw-bold"><i class="fas fa-exclamation-triangle text-warning me-2"></i> FORMULIR LAPORAN KPC</h4>
            <p class="text-muted border-bottom pb-3 mb-4">Kondisi Potensial Cedera (KPC) adalah kondisi yang sangat berpotensi untuk menimbulkan cedera, tetapi belum terjadi insiden.</p>
            
            <form id="formKPC">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">1. Tanggal & Waktu Ditemukan</label>
                        <input type="datetime-local" class="form-control" name="tgl_waktu" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">2. Lokasi / Unit Ditemukan</label>
                        <input type="text" class="form-control" name="lokasi" placeholder="Misal: Selasar Lantai 2, Kamar Mandi IGD" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">3. Rincian / Deskripsi Kondisi (KPC)</label>
                    <textarea class="form-control" name="deskripsi" rows="3" placeholder="Jelaskan kondisi yang membahayakan tersebut secara rinci..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">4. Tindakan yang langsung dilakukan (Jika ada)</label>
                    <textarea class="form-control" name="tindakan" rows="2" placeholder="Misal: Memasang papan peringatan lantai licin, memindahkan barang..."></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">5. Nama Pelapor</label>
                        <input type="text" class="form-control" name="nama_pelapor" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">6. Unit Kerja Pelapor</label>
                        <input type="text" class="form-control" name="unit_pelapor" required>
                    </div>
                </div>

                <div class="mb-4 p-3 border rounded bg-light">
                    <label class="form-label fw-bold text-primary"><i class="fas fa-camera"></i> 7. Upload Bukti Foto Kondisi (Opsional)</label>
                    <input class="form-control" type="file" id="buktiFoto" accept="image/*, .pdf">
                    <div class="form-text text-danger" id="fileWarning">Ukuran file maksimal 2 MB agar proses upload lancar.</div>
                </div>

                <div class="d-flex justify-content-end mt-4 p-3 bg-light border-top">
                    <button type="submit" class="btn btn-warning fw-bold px-4" id="btnSimpan">KIRIM LAPORAN KPC</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // MASUKKAN URL WEB APP KPC ANDA DI SINI
            const scriptURL = "https://script.google.com/macros/s/AKfycbxuu_u_pYsmfSYAoy9arI76xSrGddgSSQMsBzjknysotJF2b0Rk5n7v25AjAe6LbBpi/exec";
            
            const editDataStr = localStorage.getItem('editDataKPC');
            let isEditMode = false;
            let editTargetId = null;

            const submitBtn = document.getElementById("btnSimpan");
            const form = document.getElementById("formKPC");
            const fileInput = document.getElementById("buktiFoto");

            // --- JIKA HALAMAN DIBUKA UNTUK EDIT LAPORAN LAMA ---
            if (editDataStr) {
                isEditMode = true;
                const data = JSON.parse(editDataStr);
                editTargetId = data.Timestamp;

                submitBtn.innerHTML = "UPDATE LAPORAN KPC";
                const headerDesc = document.querySelector('.text-muted.border-bottom');
                if(headerDesc) headerDesc.innerHTML += ` <span class="badge bg-warning text-dark ms-2">MODE EDIT</span>`;

                if (data['Tgl & Waktu Penemuan']) {
                    const d = new Date(data['Tgl & Waktu Penemuan']);
                    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                    const tglInput = document.querySelector('[name="tgl_waktu"]');
                    if(tglInput) tglInput.value = d.toISOString().slice(0, 16);
                }
                
                const fill = (name, val) => { const el = document.querySelector(`[name="${name}"]`); if(el && val) el.value = val; };
                fill('lokasi', data['Lokasi / Unit']);
                fill('deskripsi', data['Deskripsi KPC']);
                fill('tindakan', data['Tindakan yang Dilakukan']);
                fill('nama_pelapor', data['Nama Pelapor']);
                fill('unit_pelapor', data['Unit Pelapor']);
            }

            // --- PROSES SAAT TOMBOL DIKLIK ---
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                
                // Cek ukuran file (Maks 2MB)
                if (fileInput.files.length > 0 && fileInput.files[0].size > 2 * 1024 * 1024) {
                    alert("Ukuran file terlalu besar! Maksimal 2 MB.");
                    return;
                }

                submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Mengirim...';
                submitBtn.disabled = true;

                // Ambil data form
                const inputData = Object.fromEntries(new FormData(form).entries());

                // Siapkan paket data (payload)
                const payload = { 
                    action: isEditMode ? 'update' : 'create', 
                    data: inputData 
                };
                if (isEditMode) payload.id = editTargetId; // Tambahkan ID jika sedang edit

                // Jika ada foto yang di-upload
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();
                    
                    reader.onload = function(event) {
                        payload.data.fileData = event.target.result;
                        payload.data.fileName = file.name;
                        kirimDataKeServer(payload); // Foto selesai dibaca, kirim ke server
                    };
                    reader.onerror = function() {
                        alert("Gagal membaca file foto.");
                        resetTombol();
                    };
                    
                    reader.readAsDataURL(file);
                } else {
                    kirimDataKeServer(payload); // Jika tanpa foto, langsung kirim
                }
            });

            function resetTombol() {
                submitBtn.innerHTML = isEditMode ? "UPDATE LAPORAN KPC" : "KIRIM LAPORAN KPC";
                submitBtn.disabled = false;
            }

            // --- FUNGSI MENGIRIM KE GOOGLE APPS SCRIPT ---
            function kirimDataKeServer(payloadData) {
                fetch(scriptURL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payloadData),
                })
                .then(response => response.json())
                .then(result => {
                    if (result.status === "success") {
                        alert("Laporan KPC berhasil terkirim!");
                        if(isEditMode) {
                            localStorage.removeItem('editDataKPC');
                            window.location.href = 'daftar_kpc.html'; // Kembali ke daftar jika habis edit
                        } else {
                            form.reset(); // Kosongkan form jika laporan baru
                        }
                    } else {
                        alert("Terjadi kesalahan server: " + result.message);
                    }
                })
                .catch(error => {
                    console.error(error);
                    alert("Gagal terhubung ke server. Pastikan URL Apps Script benar.");
                })
                .finally(() => {
                    resetTombol();
                });
            }
        });
    </script>
    <script src="components.js"></script>
</body>
</html>
