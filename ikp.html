<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir IKP - SIM PMKP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #f4f6f9; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .form-section-title { color: #5a5c69; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 20px; margin-top: 30px; font-weight: bold; }
        .card-custom { box-shadow: 0 4px 15px rgba(0,0,0,.05); border-radius: 8px; border-top: 4px solid #3c8dbc; background: #fff;}
        .btn-simpan { background-color: #3c8dbc; border-color: #367fa9; color: white; width: 100%; font-weight: bold; }
        .btn-simpan:hover { background-color: #367fa9; color: white; }
        
       /* Pewarnaan Grading Matrix */
        .grade-biru { background-color: #0dcaf0 !important; color: #fff !important; border: 2px solid #0b9ebc !important; }
        .grade-hijau { background-color: #198754 !important; color: #fff !important; border: 2px solid #146c43 !important; }
        .grade-kuning { background-color: #ffc107 !important; color: #212529 !important; border: 2px solid #cc9a06 !important; }
        .grade-merah { background-color: #dc3545 !important; color: #fff !important; border: 2px solid #b02a37 !important; }

        .box-grading { border-radius: 10px; padding: 20px; text-align: center; transition: 0.3s; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container" style="max-width: 900px;">
        <div class="card-custom p-4">
            <h4 class="mb-4 text-secondary d-flex align-items-center">
                <span class="fs-3 me-2 text-dark"><i class="fas fa-exclamation-triangle text-danger me-2"></i> IKP</span> 
                <small class="text-muted fs-6 mt-1" style="line-height: 1.2;">FORMULIR LAPORAN INSIDEN KESELAMATAN PASIEN<br>(KTD, KNC, KTC, SENTINEL)</small>
            </h4>
            
            <form id="ikpForm">
                <h5 class="form-section-title text-primary"><i class="fas fa-user-injured me-2"></i> A. DATA PASIEN</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Nama Pasien</label>
                        <input type="text" class="form-control border-secondary" id="inp_nama_pasien" placeholder="Inisial atau Nama Lengkap">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">No. Rekam Medis</label>
                        <input type="text" class="form-control border-secondary" id="inp_no_rm" placeholder="Contoh: 123456">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Umur</label>
                        <div class="d-flex align-items-center gap-2">
                            <input type="number" class="form-control" id="inp_umur_hari" placeholder="Hari">
                            <input type="number" class="form-control" id="inp_umur_bulan" placeholder="Bln">
                            <input type="number" class="form-control" id="inp_umur_tahun" placeholder="Thn">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Jenis Kelamin</label>
                        <select class="form-select" id="inp_jk">
                            <option value="">-- Pilih --</option>
                            <option value="Perempuan">Perempuan</option>
                            <option value="Laki-laki">Laki-laki</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Penanggung Biaya</label>
                        <select class="form-select" id="inp_biaya">
                            <option value=""></option>
                            <option value="BPJS">BPJS</option>
                            <option value="Umum/Pribadi">Umum/Pribadi</option>
                            <option value="Asuransi Lain">Asuransi Lain</option>
                            <option value="Jamkesda">Jamkesda</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tgl. Mendapat Pelayanan</label>
                        <input type="datetime-local" class="form-control" id="inp_tgl_pelayanan">
                    </div>
                </div>

                <h5 class="form-section-title text-success"><i class="fas fa-notes-medical me-2"></i> B. RINCIAN KEJADIAN</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tanggal & Waktu Insiden <span class="text-danger">*</span></label>
                        <input type="datetime-local" class="form-control border-success" id="inp_tgl_insiden" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Jenis Insiden <span class="text-danger">*</span></label>
                        <select class="form-select border-success fw-bold" id="inp_jenis_insiden" required>
                            <option value="">-- Pilih --</option>
                            <option value="KNC">KNC (Kejadian Nyaris Cedera)</option>
                            <option value="KTC">KTC (Kejadian Tidak Cedera)</option>
                            <option value="KTD">KTD (Kejadian Tidak Diharapkan - Cedera)</option>
                            <option value="Sentinel">Sentinel (Kematian/Cedera Serius)</option>
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Deskripsi Insiden <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="inp_insiden" required placeholder="Contoh: Pasien jatuh dari tempat tidur">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label fw-bold">Kronologis Kejadian <span class="text-danger">*</span></label>
                        <small class="d-block text-muted mb-2">(Nama Pasien, Dokter, Perawat harap diinisialkan saja)</small>
                        <textarea class="form-control" id="inp_kronologis" rows="4" required></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tempat Kejadian <span class="text-danger">*</span></label>
                        <select class="form-select" id="inp_lokasi" required>
                            <option value="">-- Memuat Unit... --</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Insiden Terjadi Pada Pasien</label>
                        <select class="form-select" id="inp_terjadi_pada">
                            <option value=""></option>
                            <option value="Penyakit Dalam">Penyakit Dalam</option>
                            <option value="Bedah">Bedah</option>
                            <option value="Kesehatan Anak">Kesehatan Anak</option>
                            <option value="Obstetri dan Ginekologi">Obstetri dan Ginekologi</option>
                            <option value="Saraf">Saraf</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-bold">Unit Penyebab Insiden</label>
                        <select class="form-select" id="inp_unit_penyebab">
                            <option value=""></option>
                            <option value="Farmasi">Farmasi</option>
                            <option value="Laboratorium">Laboratorium</option>
                            <option value="Radiologi">Radiologi</option>
                            <option value="Rekam Medis">Rekam Medis</option>
                            <option value="Gizi">Gizi</option>
                            <option value="IGD">IGD</option>
                            <option value="Rawat Inap">Rawat Inap</option>
                            <option value="Rawat Jalan">Rawat Jalan</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Pertama Melaporkan</label>
                        <select class="form-select" id="inp_pelapor_pertama">
                            <option value="Perawat">Perawat</option>
                            <option value="Dokter">Dokter</option>
                            <option value="Pasien">Pasien/Keluarga</option>
                            <option value="Karyawan Lain">Karyawan Lain</option>
                        </select>
                    </div>

                    <div class="col-md-12 mt-3">
                        <label class="form-label fw-bold">Tindakan Lanjut Seketika <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="inp_tindak_lanjut" rows="2" required placeholder="Tindakan yang langsung dilakukan..."></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Tindakan Dilakukan Oleh</label>
                        <select class="form-select" id="inp_dilakukan_oleh">
                            <option value="Perawat">Perawat / Bidan</option>
                            <option value="Dokter">Dokter</option>
                            <option value="Tim">Tim</option>
                            <option value="Karyawan Lain">Karyawan Lain</option>
                        </select>
                    </div>

                    <div class="col-md-12 mt-4 p-3 bg-light border rounded">
                        <label class="form-label fw-bold">Apakah kejadian yang sama pernah terjadi di Unit lain? <span class="text-danger">*</span></label>
                        <div class="form-check mb-1">
                            <input class="form-check-input" type="radio" name="pernah_terjadi" id="radTidak" value="Tidak" checked>
                            <label class="form-check-label" for="radTidak">Tidak</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="pernah_terjadi" id="radYa" value="Ya">
                            <label class="form-check-label" for="radYa">Ya</label>
                        </div>
                        
                        <div id="boxPencegahan" class="mt-3 d-none">
                            <label class="form-label fw-bold text-primary">Tindakan Pencegahan Mencegah Terulang <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="inp_tindakan_pencegahan" rows="2" placeholder="Jelaskan langkah preventif..."></textarea>
                        </div>
                    </div>

                    <div class="col-md-12 mt-4 border-top pt-4">
                        <h6 class="fw-bold text-warning text-darken mb-3"><i class="fas fa-chess-board me-2"></i> C. Penilaian Risiko (Grading Matrix)</h6>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Dampak Insiden</label>
                                <select class="form-select bg-light" id="inp_dampak" onchange="hitungGrading()">
                                    <option value="1">1 - Tidak Signifikan (Tidak ada cedera)</option>
                                    <option value="2">2 - Minor (Cedera ringan, luka lecet)</option>
                                    <option value="3">3 - Moderat (Cedera sedang, perpanjang rawat)</option>
                                    <option value="4">4 - Mayor (Cedera luas/berat, cacat)</option>
                                    <option value="5">5 - Katastropik (Kematian)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Probabilitas (Frekuensi)</label>
                                <select class="form-select bg-light" id="inp_probabilitas" onchange="hitungGrading()">
                                    <option value="1">1 - Sangat Jarang (> 5 tahun sekali)</option>
                                    <option value="2">2 - Jarang (2-5 tahun sekali)</option>
                                    <option value="3">3 - Mungkin (1-2 tahun sekali)</option>
                                    <option value="4">4 - Sering (Beberapa kali / tahun)</option>
                                    <option value="5">5 - Sangat Sering (Tiap minggu / bulan)</option>
                                </select>
                            </div>
                        </div>
                        <div id="hasilGrading" class="box-grading bg-light border shadow-sm mt-3">
                            <label class="form-label fw-bold text-secondary mb-1">Hasil Grading Risiko:</label>
                            <h3 class="fw-bold mb-0" id="txtLevelRisiko">-</h3>
                            <input type="hidden" id="hide_grading_warna">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-5 border-top pt-3">
                    <button type="submit" class="btn btn-simpan shadow" id="btnSubmit"><i class="fas fa-paper-plane me-2"></i> KIRIM LAPORAN</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LIBRARY SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const sessionMutu = JSON.parse(localStorage.getItem("sessionMutu")) || {};
        
        document.addEventListener("DOMContentLoaded", async function () {
            if (!supabaseClient) return;

            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('inp_tgl_insiden').value = now.toISOString().slice(0, 16);

            await loadUnitDropdown();
            hitungGrading();

            // Toggle Textarea Pencegahan
            document.querySelectorAll('input[name="pernah_terjadi"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    let box = document.getElementById('boxPencegahan');
                    let inp = document.getElementById('inp_tindakan_pencegahan');
                    if (this.value === 'Ya') {
                        box.classList.remove('d-none');
                        inp.setAttribute('required', 'required');
                    } else {
                        box.classList.add('d-none');
                        inp.removeAttribute('required');
                    }
                });
            });
        });

        async function loadUnitDropdown() {
            try {
                const { data } = await supabaseClient.from('master_unit').select('nama_unit').order('nama_unit');
                const sel = document.getElementById('inp_lokasi');
                if (data) {
                    sel.innerHTML = '<option value="">-- Pilih Lokasi Insiden --</option>';
                    data.forEach(u => sel.add(new Option(u.nama_unit, u.nama_unit)));
                }
            } catch(e) {}
        }

        // MESIN GRADING KEMENKES 5x5
        window.hitungGrading = function() {
            let dampak = parseInt(document.getElementById('inp_dampak').value);
            let prob = parseInt(document.getElementById('inp_probabilitas').value);
            
            let box = document.getElementById('hasilGrading');
            let txtLevel = document.getElementById('txtLevelRisiko');
            let hideWarna = document.getElementById('hide_grading_warna');

            box.classList.remove('grade-biru', 'grade-hijau', 'grade-kuning', 'grade-merah', 'bg-light', 'text-white', 'text-dark');

            let warna = "Biru";
            if (dampak === 5) { if (prob >= 2) warna = "Merah"; else warna = "Kuning"; } 
            else if (dampak === 4) { if (prob >= 3) warna = "Merah"; else warna = "Kuning"; } 
            else if (dampak === 3) { if (prob >= 4) warna = "Merah"; else if (prob === 3) warna = "Kuning"; else warna = "Hijau"; } 
            else if (dampak === 2) { if (prob === 5) warna = "Kuning"; else if (prob >= 3) warna = "Hijau"; else warna = "Biru"; } 
            else if (dampak === 1) { if (prob >= 4) warna = "Hijau"; else warna = "Biru"; }

            if (warna === "Merah") { box.classList.add('grade-merah', 'text-white'); txtLevel.innerText = "EKSTREM (Merah)"; } 
            else if (warna === "Kuning") { box.classList.add('grade-kuning', 'text-dark'); txtLevel.innerText = "TINGGI (Kuning)"; } 
            else if (warna === "Hijau") { box.classList.add('grade-hijau', 'text-white'); txtLevel.innerText = "SEDANG (Hijau)"; } 
            else { box.classList.add('grade-biru', 'text-white'); txtLevel.innerText = "RENDAH (Biru)"; }

            hideWarna.value = warna;
        };

        // SIMPAN DATA IKP KE SUPABASE (JSONB)
        document.getElementById('ikpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Mengirim...';
            btn.disabled = true;

            // Kita satukan detail spesifik IKP ke dalam JSONB agar tabel ringkas
            const detailJSON = {
                umur_hari: document.getElementById('inp_umur_hari').value,
                umur_bulan: document.getElementById('inp_umur_bulan').value,
                umur_tahun: document.getElementById('inp_umur_tahun').value,
                jenis_kelamin: document.getElementById('inp_jk').value,
                penanggung_biaya: document.getElementById('inp_biaya').value,
                tgl_pelayanan: document.getElementById('inp_tgl_pelayanan').value,
                terjadi_pada_pasien: document.getElementById('inp_terjadi_pada').value,
                unit_penyebab: document.getElementById('inp_unit_penyebab').value,
                pelapor_pertama: document.getElementById('inp_pelapor_pertama').value,
                pernah_terjadi_sebelumnya: document.getElementById('radYa').checked ? "Ya" : "Tidak",
                tindakan_pencegahan: document.getElementById('inp_tindakan_pencegahan').value
            };

            const payloadData = {
                jenis_insiden: document.getElementById('inp_jenis_insiden').value, // KTD, KNC, dll
                waktu_insiden: document.getElementById('inp_tgl_insiden').value,
                unit_pelapor: sessionMutu.unit || "Tidak Diketahui",
                lokasi_kejadian: document.getElementById('inp_lokasi').value,
                nama_pasien: document.getElementById('inp_nama_pasien').value,
                no_rm: document.getElementById('inp_no_rm').value,
                kronologi: `Insiden: ${document.getElementById('inp_insiden').value}\n\nKronologis:\n${document.getElementById('inp_kronologis').value}`,
                tindakan_segera: document.getElementById('inp_tindak_lanjut').value,
                pelaksana_tindakan: document.getElementById('inp_dilakukan_oleh').value,
                skor_dampak: parseInt(document.getElementById('inp_dampak').value),
                skor_probabilitas: parseInt(document.getElementById('inp_probabilitas').value),
                grading_risiko: document.getElementById('hide_grading_warna').value,
                nama_pelapor: sessionMutu.nama_lengkap || "Anonim",
                detail_spesifik: detailJSON // INJEKSI JSONB
            };

            try {
                const { error } = await supabaseClient.from('data_insiden').insert([payloadData]);
                if (error) throw error;

                Swal.fire({
                    title: 'Laporan IKP Terkirim!',
                    text: 'Terima kasih telah berkontribusi untuk keselamatan pasien. Laporan ini akan segera diinvestigasi oleh Komite Mutu.',
                    icon: 'success',
                    allowOutsideClick: false
                }).then(() => {
                    document.getElementById('ikpForm').reset();
                    hitungGrading();
                    document.getElementById('boxPencegahan').classList.add('d-none');
                });
            } catch (err) {
                console.error(err);
                Swal.fire('Gagal!', 'Terjadi kesalahan sistem saat mengirim laporan.', 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> KIRIM LAPORAN';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
