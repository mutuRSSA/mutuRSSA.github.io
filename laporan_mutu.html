<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Capaian Mutu - Komite Mutu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 4px 6px rgba(0,0,0,.05); border-radius: 8px; border-top: 4px solid #0dcaf0; }
        .bg-custom-dark { background-color: #3c8dbc; }
        .chart-container { position: relative; height: 250px; width: 100%; }
        
        .status-tercapai { color: #198754; font-weight: 900; }
        .status-gagal { color: #dc3545; font-weight: 900; }
        .target-text { color: #6c757d; font-weight: 600; }
        
        .table-responsive::-webkit-scrollbar { height: 10px; }
        .table-responsive::-webkit-scrollbar-thumb { background: #adb5bd; border-radius: 5px; }

        @media print {
            body { background-color: #fff !important; padding-top: 0 !important; }
            #navbar-container, #sidebar-container, .d-print-none, .btn { display: none !important; }
            .card-custom { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .card { border: none !important; box-shadow: none !important; margin-bottom: 20px !important; page-break-inside: avoid; }
            .table { font-size: 10px !important; border-collapse: collapse !important; }
            .table th, .table td { padding: 4px !important; border: 1px solid #000 !important; }
            .chart-container { height: 220px !important; }
            .row { display: flex; flex-wrap: wrap; }
            .col-md-6 { width: 50% !important; float: left; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { margin: 1cm; size: landscape; }
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4">
        <div class="bg-white p-4 mb-4 card-custom d-print-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0 text-dark fw-bold"><i class="fas fa-chart-line text-info me-2"></i> Dashboard Capaian Mutu Terpadu</h4>
            </div>
            
            <div class="row g-3 bg-light p-3 rounded border align-items-end">
                <div class="col-md-2 col-sm-6">
                    <label class="form-label mb-1 fw-bold text-secondary" style="font-size: 0.85rem;">Pilih Tahun:</label>
                    <select id="filterTahun" class="form-select border-info fw-bold text-dark"></select>
                </div>
                <div class="col-md-3 col-sm-6">
                    <label class="form-label mb-1 fw-bold text-secondary" style="font-size: 0.85rem;">Unit / Instalasi:</label>
                    <select id="filterUnit" class="form-select border-info fw-bold text-dark"></select>
                </div>
                <div class="col-md-2 col-sm-6">
                    <label class="form-label mb-1 fw-bold text-secondary" style="font-size: 0.85rem;">Jenis Laporan:</label>
                    <select id="filterTipeLaporan" class="form-select border-info fw-bold text-dark">
                        <option value="bulanan">Bulanan</option>
                        <option value="triwulan">Triwulan</option>
                        <option value="semester">Semester</option>
                        <option value="tahunan">Tahunan</option>
                    </select>
                </div>
                <div class="col-md-2 col-sm-6" id="divDetailPeriode">
                    <label class="form-label mb-1 fw-bold text-secondary" style="font-size: 0.85rem;">Pilih Periode:</label>
                    <select id="filterDetailPeriode" class="form-select border-info fw-bold text-dark"></select>
                </div>
                <div class="col-md-3 col-sm-12 text-md-end mt-3 mt-md-0">
                    <button class="btn btn-primary fw-bold w-100 shadow-sm" onclick="renderDashboard()"><i class="fas fa-search me-2"></i> Tampilkan Data</button>
                </div>
            </div>
        </div>

        <div id="loadingMessage" class="alert alert-info text-center shadow-sm fw-bold">
            <i class="fas fa-spinner fa-spin me-2"></i> Mengambil data dari server...
        </div>

        <div class="bg-white p-4 card-custom" id="chartCard" style="display: none;">
            <div id="dashboardContent"></div> 
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbxYIxi4QJp7IXoYF2YahdJnxVY80JlbA2jYY-RlhMPvZJN7MBirHI-RbUS87GJ7QU4H/exec";
        
        let rawData = [];
        let rawDataAnalisa = []; 
        let chartInstances = [];
        let activePeriodeTitle = "";

        // Mengambil profil sesi pengguna dari penyimpanan browser
        let sessionMutu = JSON.parse(localStorage.getItem("sessionMutu")) || {};
        let userUnit = sessionMutu.unit || "";
        let userRole = sessionMutu.role || "";

       const kamusWaktu = {
            'bulanan': { '1': ['Januari'], '2': ['Februari'], '3': ['Maret'], '4': ['April'], '5': ['Mei'], '6': ['Juni'], '7': ['Juli'], '8': ['Agustus'], '9': ['September'], '10': ['Oktober'], '11': ['November'], '12': ['Desember'] },
            'triwulan': { '1': ['Januari', 'Februari', 'Maret'], '2': ['April', 'Mei', 'Juni'], '3': ['Juli', 'Agustus', 'September'], '4': ['Oktober', 'November', 'Desember'] },
            'semester': { '1': ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni'], '2': ['Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'] },
            'tahunan': { '1': ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'] }
        };

        // KAMUS URUTAN INM (Berdasarkan Daftar Prioritas Anda)
        const urutanINM = [
            "Kepatuhan Kebersihan Tangan",
            "Kepatuhan Penggunaan Alat Pelindung Diri",
            "Kepatuhan Identifikasi Pasien",
            "Waktu Tanggap Operasi Seksio Sesarea Emergensi",
            "Waktu Tunggu Rawat Jalan",
            "Penundaan Operasi Elektif",
            "Kepatuhan Waktu Visite Dokter",
            "Pelaporan Hasil Kritis Laboratorium",
            "Kepatuhan Penggunaan Formularium Nasional",
            "Kepatuhan Terhadap Alur Klinis",
            "Kepatuhan Upaya Pencegahan Risiko Pasien Jatuh",
            "Kecepatan Waktu Tanggap Komplain",
            "Kepuasan Pasien"
        ];

        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById('filterTipeLaporan').addEventListener('change', function() {
                const tipe = this.value;
                const detailSelect = document.getElementById('filterDetailPeriode');
                const detailDiv = document.getElementById('divDetailPeriode');
                detailSelect.innerHTML = '';
                
                if (tipe === 'bulanan') {
                    detailDiv.style.display = 'block';
                    const listBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
                    listBulan.forEach((bln, idx) => detailSelect.add(new Option(bln, (idx + 1).toString())));
                } else if (tipe === 'triwulan') {
                    detailDiv.style.display = 'block';
                    detailSelect.add(new Option('Triwulan 1', '1')); detailSelect.add(new Option('Triwulan 2', '2'));
                    detailSelect.add(new Option('Triwulan 3', '3')); detailSelect.add(new Option('Triwulan 4', '4'));
                } else if (tipe === 'semester') {
                    detailDiv.style.display = 'block';
                    detailSelect.add(new Option('Semester 1', '1')); detailSelect.add(new Option('Semester 2', '2'));
                } else {
                    detailDiv.style.display = 'none';
                    detailSelect.add(new Option('Satu Tahun', '1'));
                }
            });
            document.getElementById('filterTipeLaporan').dispatchEvent(new Event('change'));

            fetch(scriptURL).then(res => res.json()).then(result => {
                if (result.status === 'success') {
                    rawData = result.data; rawDataAnalisa = result.dataAnalisa || [];
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('chartCard').style.display = 'block';
                    
                    populateDropdowns(); 
                    aturKunciUnitDanRender();
                }
            }).catch(err => {
                document.getElementById('loadingMessage').innerHTML = '<i class="fas fa-exclamation-triangle text-danger me-2"></i> Gagal memuat data dari server.';
            });
        });

        function populateDropdowns() {
            const unitSelect = document.getElementById('filterUnit');
            unitSelect.innerHTML = '<option value="RS_ALL" class="fw-bold text-primary">🏥 SELURUH RUMAH SAKIT</option>';
            const units = [...new Set(rawData.map(item => item['Unit']))].filter(Boolean).sort();
            units.forEach(unit => { unitSelect.appendChild(new Option(unit, unit)); });
            
            const tahunSelect = document.getElementById('filterTahun');
            const tahuns = [...new Set(rawData.map(item => (item['Tahun'] || "").toString().trim()))].filter(Boolean).sort().reverse();
            tahuns.forEach(thn => { tahunSelect.appendChild(new Option(thn, thn)); });
        }

        function aturKunciUnitDanRender() {
            const unitSelect = document.getElementById('filterUnit');
            
            if (userUnit && userUnit !== "Non-Unit" && userRole !== "Komite Mutu") {
                let optionExists = Array.from(unitSelect.options).some(opt => opt.value === userUnit);
                if (!optionExists) {
                    unitSelect.add(new Option(userUnit, userUnit));
                }
                
                unitSelect.value = userUnit;
                unitSelect.setAttribute("disabled", "true");
                unitSelect.classList.add("bg-light", "text-muted");
                
                let colParent = unitSelect.parentElement;
                let info = document.createElement("small");
                info.className = "text-success fw-bold d-block mt-1 d-print-none";
                info.innerHTML = `<i class="fas fa-lock me-1"></i> Terkunci (Hak Akses Unit)`;
                colParent.appendChild(info);
            }

            renderDashboard();
        }

        function renderDashboard() {
            const selectedTahun = document.getElementById('filterTahun').value;
            const selectedUnit = (userRole !== "Komite Mutu" && userUnit) ? userUnit : document.getElementById('filterUnit').value;
            const selectedTipe = document.getElementById('filterTipeLaporan').value;
            const selectedDetail = document.getElementById('filterDetailPeriode').value;
            const namaBulan = kamusWaktu[selectedTipe][selectedDetail];
            
            if (selectedTipe === 'tahunan') {
                activePeriodeTitle = "Tahunan " + selectedTahun;
            } else if (selectedTipe === 'bulanan') {
                activePeriodeTitle = "Bulan " + namaBulan[0] + " " + selectedTahun;
            } else {
                activePeriodeTitle = selectedTipe.charAt(0).toUpperCase() + selectedTipe.slice(1) + " " + selectedDetail + " Tahun " + selectedTahun;
            }
            
            if (chartInstances.length > 0) chartInstances.forEach(chart => chart.destroy());
            chartInstances = [];
            const dashboardContent = document.getElementById('dashboardContent');
            dashboardContent.innerHTML = '';

            let filteredData = rawData.filter(row => {
            let matchUnit = (selectedUnit === "RS_ALL") ? true : (row['Unit'] === selectedUnit);
            let matchTahun = ((row['Tahun'] || "").toString().trim() === selectedTahun);
            let bulanNormalized = (row['Bulan'] || "").toString().trim().replace(/^\w/, c => c.toUpperCase());
            let matchBulan = namaBulan.includes(bulanNormalized);

            // LOGIKA CERDAS: Jika mode RS_ALL, sembunyikan indikator level unit (IMP-Unit)
            if (selectedUnit === "RS_ALL") {
                let jenis = (row['Jenis Indikator'] || "").toUpperCase();
                if (jenis.includes("UNIT")) return false; // Jangan tampilkan IMP-Unit di laporan global
            }

            return matchUnit && matchTahun && matchBulan;
            });

            if (filteredData.length === 0) {
                dashboardContent.innerHTML = "<div class='alert alert-warning text-center mt-4 fw-bold'>Belum ada data pelaporan untuk " + selectedUnit + " pada " + activePeriodeTitle + ".</div>";
                return;
            }

            let isAnalyzed = false; let namaKepala = "( ......................... )"; let analisaMap = {};
            let riwayat = rawDataAnalisa.filter(r => r['Unit'] === selectedUnit && r['Triwulan'] === activePeriodeTitle);
            if (riwayat.length > 0) {
                isAnalyzed = true; namaKepala = riwayat[0]['Kepala Unit'] || namaKepala;
                riwayat.forEach(r => { analisaMap[r['Judul Indikator']] = { analisa: r['Analisa'], tl: r['Tindak Lanjut'] }; });
            }

            let groupedData = {};
            filteredData.forEach(row => {
                let jenis = row['Jenis Indikator'] || 'Lainnya'; 
                let judul = row['Judul indikator'] || 'Tanpa Judul';
                let satuan = (row['Satuan'] || '-').toString().trim();
                let bulanNormalized = (row['Bulan'] || "").toString().trim().replace(/^\w/, c => c.toUpperCase());
                
                let num = parseFloat((row['Numerator'] || 0).toString().replace(',', '.')) || 0;
                let den = parseFloat((row['Denominator'] || 0).toString().replace(',', '.')) || 0;
                let t = parseFloat((row['Target'] || 0).toString().replace(',', '.'));
                let c = parseFloat((row['Pencapaian'] || 0).toString().replace(',', '.'));

                // Deteksi jika ini adalah indikator survei/indeks tanpa pecahan
                let isKepuasan = judul.toLowerCase().includes('kepuasan');

                // --- SUNTIKAN 1: PELEBURAN TOTAL HAIs & SSI ---
                let judulUpper = judul.toUpperCase();
                let isHAI = judulUpper.includes('CAUTI') || judulUpper.includes('VAP') || judulUpper.includes('CLABSI') || judulUpper.includes('PHLEBITIS') || judulUpper.includes('FLEBITIS');
                let isSSI = judulUpper.includes('SSI ');

                if (isHAI) judul = "Total Insidensi HAIs 🔍";
                if (isSSI) judul = "Total Insidensi SSI 🔍";
                // -----------------------------------------------

                if (!groupedData[jenis]) groupedData[jenis] = {};
                if (!groupedData[jenis][judul]) {
                    groupedData[jenis][judul] = { satuan: satuan, bulans: {} };
                    // Tambahkan sumC dan countC untuk keperluan rata-rata indeks
                    namaBulan.forEach(b => groupedData[jenis][judul].bulans[b] = { target: null, capai: null, num: 0, den: 0, sumC: 0, countC: 0 });
                }
                
                if (groupedData[jenis][judul].bulans[bulanNormalized] !== undefined) {
                    let pointer = groupedData[jenis][judul].bulans[bulanNormalized];
                    
                    pointer.target = Math.round(t * 100) / 100;

                    if (selectedUnit === "RS_ALL") {
                        pointer.num += num;
                        pointer.den += den;
                        
                        // LOGIKA CERDAS: Jika ini Kepuasan Pasien ATAU tidak punya N/D
                        if (isKepuasan || (num === 0 && den === 0 && c > 0)) {
                            pointer.sumC += c;
                            pointer.countC += 1;
                            // Jangan dibagi num/den, langsung rata-ratakan nilai capaiannya
                            pointer.capai = Math.round((pointer.sumC / pointer.countC) * 100) / 100;
                        } else {
                            // HITUNG ULANG NORMAL (N/D)
                            if (pointer.den > 0) {
                                let hitungUlang = pointer.num / pointer.den;
                                if (satuan.includes('%')) hitungUlang *= 100;
                                pointer.capai = Math.round(hitungUlang * 100) / 100;
                            } else {
                                pointer.capai = 0;
                            }
                        }
                    } else {
                        pointer.capai = Math.round(c * 100) / 100;
                        pointer.num = num;
                        pointer.den = den;
                    }
                }
            });

            let fullHtml = "<div class='d-none d-print-block text-center mb-4 pb-2 border-bottom border-dark border-3'>" +
                "<h3 class='fw-bold mb-1'>LAPORAN CAPAIAN INDIKATOR MUTU RSUD SARAS ADYATMA</h3>" +
                "<h5 class='text-uppercase mb-0'>" + activePeriodeTitle + " - UNIT " + selectedUnit + "</h5></div>" +
                "<div class='d-flex justify-content-between align-items-center mb-4 border-bottom pb-3 d-print-none'>" +
                "<h5 class='fw-bold text-secondary mb-0'><i class='fas fa-hospital me-2'></i> " + selectedUnit + " (" + activePeriodeTitle + ")</h5><div>";
                
            if (!isAnalyzed) fullHtml += "<button id='btnToggleAnalisa' class='btn btn-warning fw-bold text-dark px-3 me-2' onclick='toggleAnalisaMode()'><i class='fas fa-edit me-1'></i> Mode Analisa</button>";
            fullHtml += "<button class='btn btn-danger fw-bold px-3' onclick='window.print()'><i class='fas fa-print me-1'></i> Cetak Dokumen</button>" +
                "<button class='btn btn-primary fw-bold px-3 ms-2' onclick='exportKeWord()'><i class='fas fa-file-word me-1'></i> Export Word</button></div></div>";

            let chartConfigs = []; let chartIdCounter = 0;
            let thBulan = namaBulan.map(b => "<th colspan='2' style='min-width:90px;'>" + b + "</th>").join('');
            let thTargetCapai = namaBulan.map(() => "<th>Tgt</th><th>Cpa</th>").join('');

            for (let jenis in groupedData) {
                let tableRows = ''; let nomor = 1; let cardsHtml = '';
                
                // 1. Ambil semua judul indikator
                let daftarJudul = Object.keys(groupedData[jenis]);

                // 2. MESIN PENGURUTAN SAPU JAGAT
                daftarJudul.sort((a, b) => {
                    let textA = a.toLowerCase();
                    let textB = b.toLowerCase();

                    // Menggunakan kata kunci pendek agar kebal typo (Urutan 1 - 13)
                    const keywords = [
                        "kebersihan tangan", "pelindung diri", "identifikasi pasien", 
                        "seksio sesarea", "alur klinis", "tunggu rawat jalan", "penundaan operasi", 
                        "visite dokter", "kritis", "formularium", "risiko pasien jatuh", 
                        "tanggap komplain", "kepuasan"
                    ];

                    let indexA = keywords.findIndex(k => textA.includes(k));
                    let indexB = keywords.findIndex(k => textB.includes(k));

                    // Jika tidak ada di daftar 13 INM, lempar ke urutan paling bawah
                    if (indexA === -1) indexA = 999;
                    if (indexB === -1) indexB = 999;

                    // Urutkan berdasarkan prioritas kata kunci, sisanya urut abjad
                    if (indexA !== indexB) return indexA - indexB;
                    return textA.localeCompare(textB);
                });

                // 3. Gunakan for...of untuk membaca data yang SUDAH DIURUTKAN
                for (let judul of daftarJudul) {
                    let item = groupedData[jenis][judul];
                    let tdHtml = namaBulan.map(b => {
                        let t = item.bulans[b].target; 
                        let c = item.bulans[b].capai;
                        let num = item.bulans[b].num;
                        let den = item.bulans[b].den;

                        if (t === null) return "<td>-</td><td>-</td>";
                        let cl = c >= t ? 'status-tercapai' : 'status-gagal';

                        // LOGIKA CERDAS: Sembunyikan N & D khusus untuk Kepuasan Pasien
                        let infoNumDen = "";
                        let isKepuasan = judul.toLowerCase().includes('kepuasan');
                        
                        if (!isKepuasan && num !== '' && den !== '' && num !== null && den !== null) {
                            infoNumDen = `<br><small class='text-muted' style='font-size: 0.65rem;'>(N:${num} / D:${den})</small>`;
                        }

                        return "<td class='target-text text-center align-middle'>" + t + "</td><td class='text-center align-middle " + cl + "'>" + c + infoNumDen + "</td>";
                    }).join('');

                    // --- SUNTIKAN 2: TOMBOL KLIK MODAL ---
                    let judulDisplay = judul;
                    if (judul.includes("HAIs 🔍")) {
                        judulDisplay = `<a href="#" class="text-decoration-none text-primary" data-bs-toggle="modal" data-bs-target="#modalHAIs"><i class="fas fa-hand-pointer me-2"></i>${judul}</a>`;
                    } else if (judul.includes("SSI 🔍")) {
                        judulDisplay = `<a href="#" class="text-decoration-none text-primary" data-bs-toggle="modal" data-bs-target="#modalSSI"><i class="fas fa-hand-pointer me-2"></i>${judul}</a>`;
                    }
                    
                    tableRows += "<tr><td class='text-center align-middle'>" + (nomor++) + "</td><td class='fw-bold align-middle'>" + judulDisplay + "</td><td class='text-center align-middle'>" + item.satuan + "</td>" + tdHtml + "</tr>";
                    // --------------------------------------

                    let htmlAnalisaText = "";
                    if (isAnalyzed && analisaMap[judul]) {
                        htmlAnalisaText = "<div class='mt-3 pt-2 border-top'><p class='mb-1 fw-bold text-danger' style='font-size:0.8rem;'>Analisa:</p><div class='p-2 bg-light border rounded' style='font-size:0.85rem;'>" + analisaMap[judul].analisa + "</div>" +
                            "<p class='mb-1 mt-2 fw-bold text-success' style='font-size:0.8rem;'>Tindak Lanjut:</p><div class='p-2 bg-light border rounded' style='font-size:0.85rem;'>" + analisaMap[judul].tl + "</div></div>";
                    } else if (!isAnalyzed) {
                        htmlAnalisaText = "<div class='analisa-container mt-3 pt-2 border-top' style='display: none;'><label class='fw-bold text-danger' style='font-size:0.8rem;'>Analisa:</label><textarea class='form-control form-control-sm input-analisa' data-judul='" + judul + "' rows='2'></textarea>" +
                            "<label class='fw-bold text-success mt-2' style='font-size:0.8rem;'>Tindak Lanjut:</label><textarea class='form-control form-control-sm input-tl' data-judul='" + judul + "' rows='2'></textarea></div>";
                    }

                    let canvasId = "chart-" + (chartIdCounter++);
                    
                    // Jika bulanan pakai lebar penuh, jika lainnya pakai separuh layar (col-md-6)
                    let colWidth = (selectedTipe === 'tahunan' || selectedTipe === 'bulanan') ? 'col-12' : 'col-md-6';
                    
                    // Sembunyikan div Chart jika laporannya Bulanan
                    let chartAreaHtml = selectedTipe === 'bulanan' ? "" : "<div class='chart-container'><canvas id='" + canvasId + "'></canvas></div>";
                    
                    cardsHtml += "<div class='" + colWidth + " mb-4'><div class='card h-100 shadow-sm'><div class='card-body'><h6 class='text-center fw-bold'>" + judul + "</h6>" + chartAreaHtml + htmlAnalisaText + "</div></div></div>";
                    
                    // Jangan perintahkan Chart.js untuk menggambar jika modenya Bulanan
                    if (selectedTipe !== 'bulanan') {
                        chartConfigs.push({ id: canvasId, labels: namaBulan, target: namaBulan.map(b => item.bulans[b].target), capai: namaBulan.map(b => item.bulans[b].capai), satuan: item.satuan });
                    }}
                
                fullHtml += "<div class='mt-4 mb-2'><h5 class='fw-bold text-primary border-start border-4 border-primary ps-2'>" + jenis + "</h5></div>" +
                    "<div class='table-responsive mb-4 shadow-sm'><table class='table table-bordered table-hover mb-0' style='font-size: 0.8rem; background:#fff;'><thead class='text-center bg-light'><tr><th rowspan='2' class='align-middle'>No</th><th rowspan='2' class='align-middle'>Indikator</th><th rowspan='2' class='align-middle'>Sat</th>" + thBulan + "</tr><tr>" + thTargetCapai + "</tr></thead><tbody>" + tableRows + "</tbody></table></div><div class='row'>" + cardsHtml + "</div>";
            }

            // =================================================================
            // --- SUNTIKAN 3: TABEL KHUSUS HAIs & SSI (VERSI MODAL POP-UP) ---
            // =================================================================
            
            // FUNGSI PENCARI DATA YANG LEBIH CERDAS (Mendukung banyak kata kunci & Anti-Typo)
            function getSumNumDen(keywordsIndikator, keywordUnit) {
                let num = 0; let den = 0; let found = false;
                let keys = Array.isArray(keywordsIndikator) ? keywordsIndikator : [keywordsIndikator];
                
                filteredData.forEach(r => {
                    let u = (r['Unit'] || "").toUpperCase();
                    let j = (r['Judul indikator'] || "").toUpperCase();
                    
                    let matchIndikator = keys.some(k => j.includes(k));
                    
                    if ((keywordUnit === "ALL" || u.includes(keywordUnit)) && matchIndikator) {
                        num += parseFloat((r['Numerator'] || 0).toString().replace(',', '.')) || 0;
                        den += parseFloat((r['Denominator'] || 0).toString().replace(',', '.')) || 0;
                        found = true;
                    }
                });
                let capai = den > 0 ? parseFloat(((num / den) * 100).toFixed(2)) : 0;
                return { n: num, d: den, c: capai, exist: found };
            }

            // MODAL HAIs
            // LOGIKA BARU: Cari SECARA OTOMATIS ruangan mana saja yang mengirim data HAIs
            let haisUnits = [...new Set(filteredData.filter(r => {
                let j = (r['Judul indikator'] || "").toUpperCase();
                return j.includes('CAUTI') || j.includes('VAP') || j.includes('CLABSI') || j.includes('PHLEBITIS') || j.includes('FLEBITIS');
            }).map(r => r['Unit']))].filter(Boolean).sort();

            if (selectedUnit === "RS_ALL" || haisUnits.includes(selectedUnit)) {
                let innerHtmlHAIs = "<div class='table-responsive mb-0'><table class='table table-bordered table-hover mb-0' style='font-size: 0.85rem; background:#fff; min-width: 1200px;'>" +
                    "<thead class='text-center bg-light'><tr><th rowspan='2' class='align-middle'>Ruang</th><th colspan='3'>CAUTI</th><th colspan='3'>VAP</th><th colspan='3'>CLABSI</th><th colspan='3'>Phlebitis</th></tr>" +
                    "<tr><th class='align-middle'>Jumlah<br>Kasus</th><th class='align-middle text-muted' style='font-size:0.75rem;'>Jumlah lama hari pemakaian<br>kateter urin menetap</th><th class='align-middle'>Insiden(%)</th>" +
                    "<th class='align-middle'>Jumlah<br>Kasus</th><th class='align-middle text-muted' style='font-size:0.75rem;'>Jumlah lama hari pemakaian<br>ventilator</th><th class='align-middle'>Insiden(%)</th>" +
                    "<th class='align-middle'>Jumlah<br>Kasus</th><th class='align-middle text-muted' style='font-size:0.75rem;'>Jumlah lama hari pemakaian<br>kateter vena sentral</th><th class='align-middle'>Insiden(%)</th>" +
                    "<th class='align-middle'>Jumlah<br>Kasus</th><th class='align-middle text-muted' style='font-size:0.75rem;'>Jumlah lama hari pemakaian<br>kateter vena perifer</th><th class='align-middle'>Insiden(%)</th></tr></thead><tbody>";

                let targetUnits = selectedUnit === "RS_ALL" ? haisUnits : [selectedUnit];
                if (targetUnits.length === 0) targetUnits = ['-']; // Fallback

                // Variabel untuk menghitung total keseluruhan agar sama persis dengan tabel depan
                let tH = { cn:0, cd:0, vn:0, vd:0, cln:0, cld:0, pn:0, pd:0 };

                targetUnits.forEach(u => {
                    let unitKey = selectedUnit === "RS_ALL" ? u.toUpperCase() : "ALL"; 
                    let cauti = getSumNumDen(['CAUTI'], unitKey); 
                    let vap = getSumNumDen(['VAP'], unitKey); 
                    let clabsi = getSumNumDen(['CLABSI'], unitKey);
                    let phlebitis = getSumNumDen(['PHLEBITIS', 'FLEBITIS'], unitKey);

                    tH.cn += cauti.n; tH.cd += cauti.d; tH.vn += vap.n; tH.vd += vap.d;
                    tH.cln += clabsi.n; tH.cld += clabsi.d; tH.pn += phlebitis.n; tH.pd += phlebitis.d;

                    innerHtmlHAIs += "<tr><td class='fw-bold align-middle'>" + u + "</td>" +
                        "<td class='text-center align-middle'>" + cauti.n + "</td><td class='text-center align-middle'>" + cauti.d + "</td><td class='text-center align-middle'>" + cauti.c + " %</td>" +
                        "<td class='text-center align-middle'>" + vap.n + "</td><td class='text-center align-middle'>" + vap.d + "</td><td class='text-center align-middle'>" + vap.c + " %</td>" +
                        "<td class='text-center align-middle'>" + clabsi.n + "</td><td class='text-center align-middle'>" + clabsi.d + "</td><td class='text-center align-middle'>" + clabsi.c + " %</td>" +
                        "<td class='text-center align-middle'>" + phlebitis.n + "</td><td class='text-center align-middle'>" + phlebitis.d + "</td><td class='text-center align-middle'>" + phlebitis.c + " %</td></tr>";
                });

                // Tampilkan Baris TOTAL di bawah
                if (targetUnits.length > 1) {
                    let cc = tH.cd > 0 ? ((tH.cn/tH.cd)*100).toFixed(2) : 0; let vc = tH.vd > 0 ? ((tH.vn/tH.vd)*100).toFixed(2) : 0;
                    let clc = tH.cld > 0 ? ((tH.cln/tH.cld)*100).toFixed(2) : 0; let pc = tH.pd > 0 ? ((tH.pn/tH.pd)*100).toFixed(2) : 0;
                    
                    innerHtmlHAIs += "<tr class='bg-warning bg-opacity-10'><td class='fw-bold text-end align-middle'>TOTAL</td>" +
                        "<td class='text-center fw-bold align-middle'>" + tH.cn + "</td><td class='text-center fw-bold align-middle'>" + tH.cd + "</td><td class='text-center fw-bold align-middle'>" + cc + " %</td>" +
                        "<td class='text-center fw-bold align-middle'>" + tH.vn + "</td><td class='text-center fw-bold align-middle'>" + tH.vd + "</td><td class='text-center fw-bold align-middle'>" + vc + " %</td>" +
                        "<td class='text-center fw-bold align-middle'>" + tH.cln + "</td><td class='text-center fw-bold align-middle'>" + tH.cld + "</td><td class='text-center fw-bold align-middle'>" + clc + " %</td>" +
                        "<td class='text-center fw-bold align-middle'>" + tH.pn + "</td><td class='text-center fw-bold align-middle'>" + tH.pd + "</td><td class='text-center fw-bold align-middle'>" + pc + " %</td></tr>";
                }

                innerHtmlHAIs += "</tbody></table></div>";

                fullHtml += `
                <div class="modal fade" id="modalHAIs" tabindex="-1" aria-hidden="true">
                  <div class="modal-dialog modal-xl modal-dialog-centered">
                    <div class="modal-content">
                      <div class="modal-header bg-custom-dark text-white">
                        <h5 class="modal-title fw-bold">Detail Data Ruangan (HAIs) - Periode ${activePeriodeTitle}</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>
                      <div class="modal-body bg-light p-4">${innerHtmlHAIs}</div>
                    </div>
                  </div>
                </div>`;
            }

            // MODAL SSI
            if (selectedUnit === "RS_ALL" || selectedUnit.toUpperCase().includes("BEDAH") || selectedUnit.toUpperCase().includes("OPERASI")) {
                let innerHtmlSSI = "<div class='table-responsive mb-0'><table class='table table-bordered table-hover mb-0' style='font-size: 0.85rem; background:#fff;'>" +
                    "<thead class='text-center bg-light'><tr><th rowspan='2' class='align-middle'>Jenis Tindakan Operasi di RS</th><th colspan='3'>SSI</th></tr>" +
                    "<tr><th class='align-middle'>Jumlah Kasus</th><th class='align-middle'>Jumlah Tindakan Operasi</th><th class='align-middle'>Insiden (%)</th></tr></thead><tbody>";

                // LOGIKA BARU: Dictionary yang mendeteksi ejaan Indonesia maupun ejaan Typo
                const opsSSI = [
                    { label: 'Bedah Orthopedi (ORIF atau Total Hip Replacement)', keys: ['ORTHO'] }, 
                    { label: 'Seksio Sesarea', keys: ['SEKSI', 'SECTI', 'SESAR'] },
                    { label: 'Apendektomi', keys: ['APEND', 'APPEN'] }, 
                    { label: 'Herniotomi', keys: ['HERNIO'] },
                    { label: 'Katarak', keys: ['KATARAK'] }, 
                    { label: 'CABG', keys: ['CABG'] }, 
                    { label: 'Tumor Jinak Payudara', keys: ['TUMOR', 'MAMMAE'] }
                ];

                let tSsiN = 0; let tSsiD = 0;

                opsSSI.forEach(op => {
                    let sum = getSumNumDen(op.keys, "ALL");
                    if (!sum.exist) {
                        innerHtmlSSI += "<tr><td class='fw-bold align-middle'>" + op.label + "</td><td colspan='3' class='text-center text-muted fw-bold align-middle bg-light'>N/A</td></tr>";
                    } else {
                        tSsiN += sum.n; tSsiD += sum.d;
                        innerHtmlSSI += "<tr><td class='fw-bold align-middle'>" + op.label + "</td><td class='text-center align-middle'>" + sum.n + "</td><td class='text-center align-middle'>" + sum.d + "</td><td class='text-center align-middle'>" + sum.c + " %</td></tr>";
                    }
                });

                // Tampilkan Baris TOTAL di bawah
                let tC = tSsiD > 0 ? ((tSsiN/tSsiD)*100).toFixed(2) : 0;
                innerHtmlSSI += "<tr class='bg-warning bg-opacity-10'><td class='fw-bold text-end align-middle'>TOTAL</td><td class='text-center fw-bold align-middle'>" + tSsiN + "</td><td class='text-center fw-bold align-middle'>" + tSsiD + "</td><td class='text-center fw-bold align-middle'>" + tC + " %</td></tr>";

                innerHtmlSSI += "</tbody></table></div>";

                fullHtml += `
                <div class="modal fade" id="modalSSI" tabindex="-1" aria-hidden="true">
                  <div class="modal-dialog modal-lg modal-dialog-centered">
                    <div class="modal-content">
                      <div class="modal-header bg-custom-dark text-white">
                        <h5 class="modal-title fw-bold">Detail Data Tindakan Operasi RS - Periode ${activePeriodeTitle}</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>
                      <div class="modal-body bg-light p-4">${innerHtmlSSI}</div>
                    </div>
                  </div>
                </div>`;
            }
            // =================================================================
            // --- AKHIR SUNTIKAN TABEL KHUSUS ---
            // =================================================================

            if (!isAnalyzed) {
                fullHtml += "<div id='analisaFooter' class='mt-5 p-4 bg-white border rounded shadow-sm d-print-none' style='display:none; border-top: 4px solid #ffc107 !important;'><h5 class='fw-bold mb-3'>Pengesahan Analisa</h5><div class='row align-items-end'><div class='col-md-6'><label class='fw-bold'>Kepala Unit:</label><input type='text' id='inputKepalaUnit' class='form-control' placeholder='Nama & Gelar...'></div><div class='col-md-6 text-md-end'><button class='btn btn-success fw-bold px-4' onclick='kirimAnalisaKeServer()'><i class='fas fa-save me-2'></i> SIMPAN ANALISA</button></div></div></div>";
            }
            
            let printName = isAnalyzed ? "<u class='fw-bold'>" + namaKepala + "</u>" : "( ......................................... )";
            fullHtml += "<div class='mt-5 pt-4 d-none d-print-block' style='page-break-inside: avoid;'><div class='row'><div class='col-8'></div><div class='col-4 text-center'><p class='mb-5'>Mengetahui,<br>Kepala Unit</p><br><br><br><p class='mb-0'>" + printName + "</p></div></div></div>";

            dashboardContent.innerHTML = fullHtml;

            chartConfigs.forEach(conf => {
                let ctx = document.getElementById(conf.id).getContext('2d');
                chartInstances.push(new Chart(ctx, {
                    type: 'line',
                    data: { labels: conf.labels, datasets: [
                        { label: 'Target', data: conf.target, borderColor: '#dc3545', borderDash: [5, 5], fill: false, tension: 0 },
                        { label: 'Pencapaian', data: conf.capai, borderColor: '#0dcaf0', backgroundColor: 'rgba(13, 202, 240, 0.1)', fill: true, tension: 0.3, pointRadius: 5 }
                    ]},
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { position: 'bottom' } } }
                }));
            });
        }

        window.toggleAnalisaMode = function() {
            const cont = document.querySelectorAll('.analisa-container');
            const foot = document.getElementById('analisaFooter');
            const btn = document.getElementById('btnToggleAnalisa');
            if (cont.length > 0) {
                const isHidden = cont[0].style.display === 'none';
                cont.forEach(el => el.style.display = isHidden ? 'block' : 'none');
                if(foot) foot.style.display = isHidden ? 'block' : 'none';
                if (isHidden) {
                    btn.innerHTML = "<i class='fas fa-times me-1'></i> Batal Analisa";
                    btn.className = "btn btn-secondary fw-bold text-white px-3 me-2";
                } else {
                    btn.innerHTML = "<i class='fas fa-edit me-1'></i> Mode Analisa";
                    btn.className = "btn btn-warning fw-bold text-dark px-3 me-2";
                }
            }
        };

        window.exportKeWord = function() {
            const content = document.getElementById('dashboardContent').cloneNode(true);
            const originalCanvases = document.querySelectorAll('canvas');
            const clonedCanvases = content.querySelectorAll('canvas');
            
            clonedCanvases.forEach((canvas, index) => {
                const img = document.createElement('img');
                img.src = originalCanvases[index].toDataURL("image/png");
                img.style.width = '100%'; 
                img.style.maxWidth = '600px';
                canvas.parentNode.replaceChild(img, canvas);
            });

            const h1 = "<ht" + "ml xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><he" + "ad><meta charset='utf-8'><st" + "yle>";
            const h2 = "body { font-family: 'Segoe UI', Arial, sans-serif; } table { border-collapse: collapse; width: 100%; margin-bottom: 20px; } th, td { border: 1px solid #000; padding: 5px; font-size: 9pt; } th { background: #f2f2f2; font-weight: bold; } .text-center { text-align: center; } .status-tercapai { color: #198754; font-weight: bold; } .status-gagal { color: #dc3545; font-weight: bold; } .fw-bold { font-weight: bold; } h3, h5, h6 { text-align: center; } .d-print-none, .btn, textarea { display: none !important; }";
            const h3 = "</st" + "yle></he" + "ad><bo" + "dy>";
            const f1 = "</bo" + "dy></ht" + "ml>";
                
            const blob = new Blob(['\ufeff', h1 + h2 + h3 + content.innerHTML + f1], { type: 'application/msword' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob); 
            link.download = "Laporan_Mutu_" + activePeriodeTitle.replace(/ /g, "_") + ".doc";
            link.click();
        };

        window.kirimAnalisaKeServer = function() {
            const unit = (userRole !== "Komite Mutu" && userUnit) ? userUnit : document.getElementById('filterUnit').value;
            const kepala = document.getElementById('inputKepalaUnit').value;
            if (!kepala) return alert("Isi nama Kepala Unit!");
            
            const details = [];
            document.querySelectorAll('.input-analisa').forEach((el, i) => {
                const a = el.value; const tl = document.querySelectorAll('.input-tl')[i].value;
                if (a || tl) details.push({ judul: el.dataset.judul, analisa: a, tl: tl });
            });

            if (details.length === 0) return alert("Anda belum mengisi analisa apapun.");

            const btnSimpan = document.querySelector('.btn-success');
            btnSimpan.innerHTML = "<i class='fas fa-spinner fa-spin me-2'></i> Menyimpan...";
            btnSimpan.disabled = true;

            fetch(scriptURL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: 'analisa', unit: unit, triwulan: activePeriodeTitle, kepala: kepala, details: details }) })
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success') {
                    alert('Analisa berhasil disimpan!'); location.reload();
                } else {
                    alert('Gagal menyimpan: ' + res.message);
                    btnSimpan.innerHTML = "<i class='fas fa-save me-2'></i> SIMPAN ANALISA"; btnSimpan.disabled = false;
                }
            }).catch(err => {
                alert('Gangguan jaringan!');
                btnSimpan.innerHTML = "<i class='fas fa-save me-2'></i> SIMPAN ANALISA"; btnSimpan.disabled = false;
            });
        };
    </script>
</body>
</html>
