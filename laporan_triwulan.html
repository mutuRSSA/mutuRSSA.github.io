<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Triwulan Mutu - Komite Mutu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 0 1px rgba(0,0,0,.125), 0 1px 3px rgba(0,0,0,.2); border-radius: 4px; border-top: 3px solid #0dcaf0; }
        .bg-custom-dark { background-color: #3c8dbc; }
        .chart-container { position: relative; height: 400px; width: 100%; }
        /* ================= CSS KHUSUS CETAK PDF ================= */
        @media print {
            body { background-color: #fff !important; padding-top: 0 !important; }
            #navbar-container, #sidebar-container, .card-custom > .d-flex.align-items-end, .d-print-none { 
                display: none !important; 
            }
            .card-custom { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .card { border: none !important; box-shadow: none !important; margin-bottom: 15px !important; page-break-inside: avoid; }
            .table { font-size: 11px !important; }
            .chart-container { height: 200px !important; }
            .col-md-6 { width: 50% !important; float: left; padding: 0 10px; }
            .row { display: flex; flex-wrap: wrap; }
            /* Memaksa background warna badge dan grafik tetap muncul saat di-print */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            @page { margin: 1cm; }
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4">
        <div class="bg-white p-4 mb-4 card-custom d-flex justify-content-between align-items-end flex-wrap gap-3 d-print-none">
            <div>
                <h4 class="mb-1 text-dark fw-bold"><i class="fas fa-chart-bar text-info me-2"></i> Dashboard Capaian Mutu Triwulan</h4>
                <p class="text-muted mb-0">Pilih Unit dan Triwulan untuk melihat perbandingan Target vs Pencapaian indikator.</p>
            </div>
            
            <div class="d-flex align-items-end gap-2 bg-light p-2 rounded border">
                <div>
                    <label class="form-label mb-0 fw-bold" style="font-size: 0.85rem;">Unit / Instalasi:</label>
                    <select id="filterUnit" class="form-select form-select-sm" style="min-width: 150px;">
                        <option value="SEMUA">-- Semua Unit --</option>
                        </select>
                </div>
                <div>
                    <label class="form-label mb-0 fw-bold" style="font-size: 0.85rem;">Pilih Triwulan:</label>
                    <select id="filterTriwulan" class="form-select form-select-sm" style="min-width: 150px;">
                        <option value="1">Triwulan 1 (Jan - Mar)</option>
                        <option value="2">Triwulan 2 (Apr - Jun)</option>
                        <option value="3">Triwulan 3 (Jul - Sep)</option>
                        <option value="4">Triwulan 4 (Okt - Des)</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="loadingMessage" class="alert alert-info text-center shadow-sm">
            <i class="fas fa-spinner fa-spin me-2"></i> Mengambil data dari server...
        </div>

        <div class="bg-white p-4 card-custom" id="chartCard" style="display: none;">
            <h5 class="text-center fw-bold text-secondary mb-4" id="chartTitle">Capaian Indikator Mutu</h5>
            
            <div id="dashboardContent"></div> 
            
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI
        const scriptURL = "https://script.google.com/macros/s/AKfycbwcFY6V-0JAUuOv79xyImDdw9-7jISWasq9UD6efGe_Odqqm5qyfUrjPkfsFa4omw2T/exec";
        
        let rawData = [];
        let rawDataAnalisa = []; // Array baru untuk menyimpan riwayat analisa
        let chartInstances = [];

        const bulanKeTriwulan = { 'januari': 1, 'februari': 1, 'maret': 1, 'april': 2, 'mei': 2, 'juni': 2, 'juli': 3, 'agustus': 3, 'september': 3, 'oktober': 4, 'november': 4, 'desember': 4 };
        const namaBulanTriwulan = { 1: ['Januari', 'Februari', 'Maret'], 2: ['April', 'Mei', 'Juni'], 3: ['Juli', 'Agustus', 'September'], 4: ['Oktober', 'November', 'Desember'] };

        document.addEventListener("DOMContentLoaded", function () {
            fetch(scriptURL)
                .then(res => res.json())
                .then(result => {
                    if (result.status === 'success') {
                        rawData = result.data;
                        rawDataAnalisa = result.dataAnalisa || []; // Ambil riwayat analisa
                        document.getElementById('loadingMessage').style.display = 'none';
                        document.getElementById('chartCard').style.display = 'block';
                        populateUnitDropdown();
                        renderDashboard(); 
                    } else { throw new Error(result.message); }
                })
                .catch(err => {
                    const msg = document.getElementById('loadingMessage');
                    msg.classList.replace('alert-info', 'alert-danger');
                    msg.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Gagal memuat data: ' + err.message;
                });

            document.getElementById('filterUnit').addEventListener('change', renderDashboard);
            document.getElementById('filterTriwulan').addEventListener('change', renderDashboard);
        });

        function populateUnitDropdown() {
            const unitSelect = document.getElementById('filterUnit');
            const units = [...new Set(rawData.map(item => item['Unit']))].filter(Boolean); 
            units.forEach(unit => { unitSelect.appendChild(new Option(unit, unit)); });
        }

        function renderDashboard() {
            const selectedUnit = document.getElementById('filterUnit').value;
            const selectedTriwulan = parseInt(document.getElementById('filterTriwulan').value);
            const namaBulan = namaBulanTriwulan[selectedTriwulan];
            
            if (chartInstances.length > 0) chartInstances.forEach(chart => chart.destroy());
            chartInstances = []; 
            const dashboardContent = document.getElementById('dashboardContent');
            dashboardContent.innerHTML = ''; 

            let filteredData = rawData.filter(row => {
                let matchUnit = (selectedUnit === 'SEMUA') || (row['Unit'] === selectedUnit);
                let matchTriwulan = (bulanKeTriwulan[(row['Bulan'] || "").toString().toLowerCase().trim()] === selectedTriwulan);
                return matchUnit && matchTriwulan;
            });

            if (filteredData.length === 0) {
                dashboardContent.innerHTML = `<div class="alert alert-warning text-center mt-4"><i class="fas fa-info-circle"></i> Tidak ada data untuk filter yang dipilih.</div>`;
                return;
            }

            // CEK APAKAH SUDAH ADA ANALISA UNTUK UNIT INI
            let isAnalyzed = false;
            let namaKepala = "( ........................................ )";
            let analisaMap = {};

            if (selectedUnit !== 'SEMUA') {
                let riwayat = rawDataAnalisa.filter(r => r['Unit'] === selectedUnit && r['Triwulan'] === "Triwulan " + selectedTriwulan);
                if (riwayat.length > 0) {
                    isAnalyzed = true;
                    namaKepala = riwayat[0]['Kepala Unit'] || namaKepala;
                    riwayat.forEach(r => {
                        analisaMap[r['Judul Indikator']] = { analisa: r['Analisa'], tl: r['Tindak Lanjut'] };
                    });
                }
            }

            // HEADER HTML (TERMASUK KOP CETAK PDF)
            let fullHtml = `
                <div class="d-none d-print-block text-center mb-5 pb-3 border-bottom border-dark border-3">
                    <h3 class="fw-bold mb-1">LAPORAN CAPAIAN INDIKATOR MUTU</h3>
                    <h5 class="text-uppercase mb-0">TRIWULAN ${selectedTriwulan} - UNIT ${selectedUnit === 'SEMUA' ? 'RUMAH SAKIT' : selectedUnit}</h5>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3 d-print-none">
                    <h5 class="fw-bold text-secondary mb-0" id="chartTitle">
                        Tren Mutu - ${selectedUnit === 'SEMUA' ? 'Semua Unit' : 'Unit ' + selectedUnit} (Triwulan ${selectedTriwulan})
                    </h5>
                    <div>
                        ${(selectedUnit !== 'SEMUA' && !isAnalyzed) ? `<button id="btnToggleAnalisa" class="btn btn-warning fw-bold text-dark px-3 me-2" onclick="toggleAnalisaMode()"><i class="fas fa-edit me-1"></i> Mode Analisa</button>` : ''}
                        
                        <button class="btn btn-danger fw-bold px-3" onclick="window.print()"><i class="fas fa-file-pdf me-1"></i> Cetak PDF</button>
                    </div>
                </div>
            `;

            // KELOMPOKKAN DATA
            let groupedData = {};
            filteredData.forEach(row => {
                let jenis = row['Jenis Indikator'] || 'Lainnya';
                let judul = row['Judul indikator'] || 'Tanpa Judul';
                let satuan = (row['Satuan'] || '-').toString().trim(); 
                let bulanNormalized = (row['Bulan'] || "").toString().trim().toLowerCase().replace(/^\w/, c => c.toUpperCase());

                if (!groupedData[jenis]) groupedData[jenis] = {};
                if (!groupedData[jenis][judul]) {
                    groupedData[jenis][judul] = { satuan: satuan, bulans: {} };
                    namaBulan.forEach(b => { groupedData[jenis][judul].bulans[b] = { target: null, capai: null }; });
                }

                if (groupedData[jenis][judul].bulans[bulanNormalized] !== undefined) {
                    let t = parseFloat((row['Target']||0).toString().replace(',', '.')) || 0;
                    let c = parseFloat((row['Pencapaian']||0).toString().replace(',', '.')) || 0;
                    if (satuan === '%' || satuan.toLowerCase() === 'persen') { t *= 100; c *= 100; }
                    groupedData[jenis][judul].bulans[bulanNormalized].target = Math.round(t * 100) / 100;
                    groupedData[jenis][judul].bulans[bulanNormalized].capai = Math.round(c * 100) / 100;
                }
            });

            let globalChartConfigs = []; 
            let chartIdCounter = 0;

            for (let jenis in groupedData) {
                let tableRows = ''; let nomor = 1;
                let cardsHtml = '';

                for (let judul in groupedData[jenis]) {
                    let item = groupedData[jenis][judul];
                    let satuanLabel = item.satuan;
                    let targetData = [item.bulans[namaBulan[0]].target, item.bulans[namaBulan[1]].target, item.bulans[namaBulan[2]].target];
                    let capaiData = [item.bulans[namaBulan[0]].capai, item.bulans[namaBulan[1]].capai, item.bulans[namaBulan[2]].capai];

                    // Data Tabel
                    tableRows += `<tr><td class="text-center">${nomor++}</td><td class="fw-bold">${judul}</td><td class="text-center"><span class="badge bg-secondary">${satuanLabel}</span></td><td class="text-center text-danger">${targetData[0]!==null?targetData[0]:'-'}</td><td class="text-center text-primary fw-bold">${capaiData[0]!==null?capaiData[0]:'-'}</td><td class="text-center text-danger">${targetData[1]!==null?targetData[1]:'-'}</td><td class="text-center text-primary fw-bold">${capaiData[1]!==null?capaiData[1]:'-'}</td><td class="text-center text-danger">${targetData[2]!==null?targetData[2]:'-'}</td><td class="text-center text-primary fw-bold">${capaiData[2]!==null?capaiData[2]:'-'}</td></tr>`;

                    // Pilihan HTML Teks Analisa (Baca Saja vs Input)
                    let htmlAnalisaText = '';
                    if (isAnalyzed && analisaMap[judul]) {
                        htmlAnalisaText = `
                            <div class="mt-3 pt-3 border-top">
                                <div class="mb-2">
                                    <p class="mb-1 fw-bold text-danger" style="font-size:0.8rem;"><i class="fas fa-microscope"></i> Analisa:</p>
                                    <div class="p-2 bg-light border rounded text-dark" style="font-size:0.85rem; text-align: justify; white-space: pre-wrap;">${analisaMap[judul].analisa || '-'}</div>
                                </div>
                                <div>
                                    <p class="mb-1 fw-bold text-success" style="font-size:0.8rem;"><i class="fas fa-clipboard-check"></i> Tindak Lanjut:</p>
                                    <div class="p-2 bg-light border rounded text-dark" style="font-size:0.85rem; text-align: justify; white-space: pre-wrap;">${analisaMap[judul].tl || '-'}</div>
                                </div>
                            </div>
                        `;
                    } else if (!isAnalyzed) {
                        htmlAnalisaText = `
                            <div class="analisa-container mt-3 pt-3 border-top d-print-none" style="display: none;">
                                <div class="mb-2">
                                    <label class="form-label fw-bold text-danger" style="font-size:0.8rem;"><i class="fas fa-microscope"></i> Analisa:</label>
                                    <textarea class="form-control form-control-sm input-analisa" data-judul="${judul}" rows="3" placeholder="Sebab capaian tercapai/tidak tercapai..."></textarea>
                                </div>
                                <div>
                                    <label class="form-label fw-bold text-success" style="font-size:0.8rem;"><i class="fas fa-clipboard-check"></i> Tindak Lanjut:</label>
                                    <textarea class="form-control form-control-sm input-tl" data-judul="${judul}" rows="3" placeholder="Rencana perbaikan (PDSA)..."></textarea>
                                </div>
                            </div>
                        `;
                    }

                    // Card Grafik
                    let canvasId = `canvas-chart-${chartIdCounter}`;
                    cardsHtml += `
                        <div class="col-md-6 mb-4">
                            <div class="card h-100 shadow-sm border-0 bg-light">
                                <div class="card-header bg-white border-bottom-0 pt-3">
                                    <h6 class="mb-0 text-center fw-bold text-dark" style="font-size:0.9rem;">${judul}</h6>
                                </div>
                                <div class="card-body pb-3">
                                    <div style="position: relative; height: 220px;" class="chart-container"><canvas id="${canvasId}"></canvas></div>
                                    ${htmlAnalisaText}
                                </div>
                            </div>
                        </div>
                    `;
                    globalChartConfigs.push({ id: canvasId, satuan: satuanLabel, targetData: targetData, capaiData: capaiData });
                    chartIdCounter++;
                }

                // Susunan Akhir per Jenis (Tabel di Atas, Grafik di Bawah)
                fullHtml += `
                    <div class="mt-4 mb-3 pb-2"><h5 class="fw-bold text-primary text-uppercase border-start border-4 border-primary ps-2">${jenis}</h5></div>
                    <div class="table-responsive mb-4">
                        <table class="table table-bordered table-striped mt-2" style="font-size: 0.85rem;">
                            <thead class="bg-light text-center align-middle">
                                <tr><th rowspan="2" width="5%">No</th><th rowspan="2" width="25%">Judul Indikator</th><th rowspan="2" width="10%">Satuan</th><th colspan="2" width="20%">${namaBulan[0]}</th><th colspan="2" width="20%">${namaBulan[1]}</th><th colspan="2" width="20%">${namaBulan[2]}</th></tr>
                                <tr><th>Target</th><th>Capai</th><th>Target</th><th>Capai</th><th>Target</th><th>Capai</th></tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                    </div>
                    <div class="row">${cardsHtml}</div>
                `; 
            }

            // BAGIAN TANDA TANGAN CETAK PDF (Otomatis terisi jika sudah dianalisa)
            let printName = isAnalyzed ? `<u class="fw-bold">${namaKepala}</u>` : `( ..................................................... )`;
            fullHtml += `
                <div class="mt-5 pt-4 d-none d-print-block" style="page-break-inside: avoid;">
                    <div class="row">
                        <div class="col-8"></div>
                        <div class="col-4 text-center">
                            <p class="mb-5">Kepala Unit / Ketua Tim,</p><br><br><br>
                            <p class="mb-0">${printName}</p>
                        </div>
                    </div>
                </div>
            `;

            // FOOTER INPUT KEPALA UNIT (Hanya jika belum dianalisa)
            if (!isAnalyzed && selectedUnit !== 'SEMUA') {
                fullHtml += `
                    <div id="analisaFooter" class="mt-5 p-4 bg-white border rounded shadow-sm d-print-none" style="display: none; border-top: 4px solid #198754 !important;">
                        <h5 class="fw-bold mb-3 text-success"><i class="fas fa-user-tie me-2"></i>Pengesahan Laporan</h5>
                        <div class="row align-items-end">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label class="form-label fw-bold">Kepala Unit / Ketua Tim:</label>
                                <input type="text" id="inputKepalaUnit" class="form-control" placeholder="Tuliskan Nama & Gelar...">
                            </div>
                            <div class="col-md-6 text-md-end">
                                <button class="btn btn-success fw-bold px-4 py-2" id="btnSimpanAnalisa" onclick="kirimAnalisaKeServer()"><i class="fas fa-save me-2"></i> SIMPAN SEMUA ANALISA</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            dashboardContent.innerHTML = fullHtml;

            // Render Chart
            globalChartConfigs.forEach(config => {
                let ctx = document.getElementById(config.id).getContext('2d');
                let newChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: namaBulan, 
                        datasets: [
                            { label: 'Target', data: config.targetData, borderColor: '#dc3545', backgroundColor: 'transparent', borderDash: [5, 5], borderWidth: 2, tension: 0, pointBackgroundColor: '#dc3545' },
                            { label: 'Pencapaian', data: config.capaiData, borderColor: '#0dcaf0', backgroundColor: 'rgba(13, 202, 240, 0.1)', fill: true, borderWidth: 3, tension: 0.3, pointBackgroundColor: '#0dcaf0', pointRadius: 5 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, title: { display: config.satuan !== '-', text: config.satuan, color: '#6c757d' } } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } }, tooltip: { callbacks: { label: function(context) { return context.dataset.label + ': ' + context.parsed.y + ' ' + (config.satuan !== '-' ? config.satuan : ''); } } } } }
                });
                chartInstances.push(newChart);
            });
        }

        // FUNGSI TOGGLE DAN SIMPAN (Sama persis seperti sebelumnya)
        window.toggleAnalisaMode = function() {
            const containers = document.querySelectorAll('.analisa-container');
            const footer = document.getElementById('analisaFooter');
            const btn = document.getElementById('btnToggleAnalisa');
            if (containers.length > 0 && containers[0].style.display === 'none') {
                containers.forEach(el => el.style.display = 'block');
                if(footer) footer.style.display = 'block';
                btn.innerHTML = '<i class="fas fa-times me-1"></i> Batal Mode Analisa';
                btn.classList.replace('btn-warning', 'btn-secondary');
            } else {
                containers.forEach(el => el.style.display = 'none');
                if(footer) footer.style.display = 'none';
                btn.innerHTML = '<i class="fas fa-edit me-1"></i> Mode Analisa';
                btn.classList.replace('btn-secondary', 'btn-warning');
            }
        };

        window.kirimAnalisaKeServer = function() {
            const unit = document.getElementById('filterUnit').value;
            const triwulan = document.getElementById('filterTriwulan').value;
            const kepala = document.getElementById('inputKepalaUnit').value;
            const btnSimpan = document.getElementById('btnSimpanAnalisa');

            if (!kepala) { alert("Harap isi nama Kepala Unit / Ketua Tim."); document.getElementById('inputKepalaUnit').focus(); return; }

            const textAreasAnalisa = document.querySelectorAll('.input-analisa');
            const textAreasTL = document.querySelectorAll('.input-tl');
            let dataDetails = [];
            
            for (let i = 0; i < textAreasAnalisa.length; i++) {
                let judul = textAreasAnalisa[i].getAttribute('data-judul');
                let a = textAreasAnalisa[i].value;
                let tl = textAreasTL[i].value;
                if (a.trim() !== "" || tl.trim() !== "") { dataDetails.push({ judul: judul, analisa: a, tl: tl }); }
            }

            if (dataDetails.length === 0) { alert("Anda belum mengisi analisa apapun."); return; }

            btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menyimpan...';
            btnSimpan.disabled = true;

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ unit: unit, triwulan: "Triwulan " + triwulan, kepala: kepala, details: dataDetails })
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === "success") {
                    alert("Analisa berhasil disimpan! Halaman akan dimuat ulang.");
                    location.reload(); // Muat ulang layar untuk memunculkan teks hasil analisa
                } else alert("Gagal menyimpan: " + result.message);
            })
            .catch(err => alert("Terjadi gangguan koneksi: " + err))
            .finally(() => { btnSimpan.innerHTML = '<i class="fas fa-save me-2"></i> SIMPAN SEMUA ANALISA'; btnSimpan.disabled = false; });
        }
    </script>
</body>
</html>
