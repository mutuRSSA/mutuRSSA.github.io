<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Unit Kerja - SIM PMKP</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { background-color: #f0f2f5; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 4px 12px rgba(0,0,0,.05); border-radius: 12px; border: none; background: #fff;}
        .table-custom th { background-color: #2c3e50; color: white; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; border: none; padding: 12px; }
        .table-custom td { vertical-align: middle; font-size: 0.95rem; border-bottom: 1px solid #f1f3f5; padding: 12px; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4" style="max-width: 1200px;">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h3 class="mb-1 text-dark fw-bold"><i class="fas fa-hospital text-primary me-2"></i> Manajemen Unit Kerja</h3>
                <p class="text-muted mb-0">Kelola daftar ruangan/unit dan alokasi indikator mutu wajib.</p>
            </div>
            <button class="btn btn-primary fw-bold shadow-sm px-4 rounded-pill" onclick="bukaModalTambah()">
                <i class="fas fa-plus-circle me-2"></i> Tambah Unit Baru
            </button>
        </div>

        <div class="card-custom p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0"><i class="fas fa-list text-secondary me-2"></i> Daftar Unit RS</h5>
                <div class="input-group" style="max-width: 300px;">
                    <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="searchUnit" placeholder="Cari unit..." onkeyup="cariUnit()">
                </div>
            </div>

            <div id="loadingMessage" class="text-center py-5">
                <i class="fas fa-circle-notch fa-spin fa-3x text-primary mb-3"></i>
                <h6 class="text-muted">Memuat data dari Supabase...</h6>
            </div>

            <div class="table-responsive d-none" id="tableContainer">
                <table class="table table-hover table-custom" id="tabelUnits">
                    <thead>
                        <tr>
                            <th width="5%" class="text-center">No</th>
                            <th width="20%">Nama Unit / Ruangan</th>
                            <th width="20%">Kepala Unit / PIC</th>
                            <th width="40%">Daftar Indikator (ID Form)</th>
                            <th width="15%" class="text-center"><i class="fas fa-cogs"></i> Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="bodyUnits"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL FORM UNIT -->
    <div class="modal fade" id="modalUnit" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-dark text-white p-3">
                    <h5 class="modal-title fw-bold" id="modalTitle"><i class="fas fa-edit me-2 text-warning"></i> Form Unit Kerja</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-light p-4">
                    <form id="formUnit">
                        <input type="hidden" id="inp_id">
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="fw-bold mb-1 text-dark">Nama Unit / Ruangan <span class="text-danger">*</span></label>
                                <input type="text" class="form-control fw-bold text-primary" id="inp_nama_unit" placeholder="Misal: UGD, ICU, Farmasi" required>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1 text-dark">Kepala Unit / Penanggung Jawab</label>
                                <input type="text" class="form-control" id="inp_kepala_unit" placeholder="Nama lengkap beserta gelar">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="fw-bold mb-1 text-dark">Daftar Indikator Mutu Wajib (ID Form)</label>
                            <textarea class="form-control" id="inp_daftar_form" rows="3" placeholder="Pisahkan dengan koma. Contoh: IAK_1, IAK_2, IAM_1"></textarea>
                            <small class="text-muted" style="font-size: 0.8rem;">Indikator yang diketik di sini akan muncul di Dasbor Input Mutu unit tersebut.</small>
                        </div>

                        <div class="d-grid mt-2 border-top pt-3">
                            <button type="button" class="btn btn-primary fw-bold py-2 shadow-sm" id="btnSimpan" onclick="simpanUnit()">
                                <i class="fas fa-save me-2"></i> Simpan Data Unit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. WAJIB: Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Skrip Utama -->
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let listUnits = [];

        document.addEventListener("DOMContentLoaded", function () {
            if (!supabaseClient) {
                Swal.fire('Error', 'Supabase belum dikonfigurasi di config.js', 'error');
                return;
            }
            loadUnits();
        });

        // 1. READ: AMBIL DATA DARI TABEL master_unit
        async function loadUnits() {
            document.getElementById('loadingMessage').classList.remove('d-none');
            document.getElementById('tableContainer').classList.add('d-none');
            
            try {
                const { data, error } = await supabaseClient
                    .from('master_unit')
                    .select('*')
                    .order('nama_unit', { ascending: true });
                
                if (error) throw error;
                
                listUnits = data;
                renderTable(listUnits);
                document.getElementById('tableContainer').classList.remove('d-none');
            } catch (err) {
                console.error(err);
                Swal.fire('Gagal!', 'Tidak dapat memuat data unit dari Supabase', 'error');
            } finally {
                document.getElementById('loadingMessage').classList.add('d-none');
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('bodyUnits'); 
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">Belum ada unit yang didaftarkan.</td></tr>';
                return;
            }

            data.forEach((unit, idx) => {
                let badgeForms = '';
                if(unit.daftar_form) {
                    let forms = unit.daftar_form.split(',').map(s => s.trim()).filter(Boolean);
                    forms.forEach(f => {
                        badgeForms += `<span class="badge bg-info text-dark me-1 mb-1 border">${f}</span>`;
                    });
                } else {
                    badgeForms = '<span class="text-muted fst-italic" style="font-size:0.8rem;">Belum ada indikator</span>';
                }

                tbody.innerHTML += `
                    <tr class="unit-row">
                        <td class="text-center fw-bold text-muted">${idx + 1}</td>
                        <td class="fw-bold text-primary search-target" style="font-size: 1.05rem;">${unit.nama_unit}</td>
                        <td class="search-target">${unit.kepala_unit || '-'}</td>
                        <td>${badgeForms}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-outline-primary rounded-circle me-1" onclick="bukaModalEdit('${unit.id}')" title="Edit Unit"><i class="fas fa-pen"></i></button>
                            <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="hapusUnit('${unit.id}', '${unit.nama_unit}')" title="Hapus Permanen"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function cariUnit() {
            let input = document.getElementById('searchUnit').value.toLowerCase();
            document.querySelectorAll('.unit-row').forEach(row => { 
                row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none'; 
            });
        }

        function bukaModalTambah() {
            document.getElementById('formUnit').reset(); 
            document.getElementById('inp_id').value = "";
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus-circle me-2 text-primary"></i> Tambah Unit Baru';
            new bootstrap.Modal(document.getElementById('modalUnit')).show();
        }

        function bukaModalEdit(idUnit) {
            const unit = listUnits.find(u => u.id == idUnit); 
            if(!unit) return;
            
            document.getElementById('inp_id').value = unit.id;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit me-2 text-warning"></i> Edit Konfigurasi Unit';
            document.getElementById('inp_nama_unit').value = unit.nama_unit;
            document.getElementById('inp_kepala_unit').value = unit.kepala_unit || '';
            document.getElementById('inp_daftar_form').value = unit.daftar_form || '';
            
            new bootstrap.Modal(document.getElementById('modalUnit')).show();
        }

        // 2. CREATE / UPDATE: SIMPAN DATA KE master_unit
        window.simpanUnit = async function() {
            const idUnit = document.getElementById('inp_id').value;
            const namaUnit = document.getElementById('inp_nama_unit').value.trim();
            const kepalaUnit = document.getElementById('inp_kepala_unit').value.trim();
            const daftarForm = document.getElementById('inp_daftar_form').value.trim();

            if (!namaUnit) { Swal.fire('Oops', 'Nama Unit wajib diisi!', 'warning'); return; }

            const btn = document.getElementById('btnSimpan'); 
            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menyimpan...';

            const payloadData = {
                nama_unit: namaUnit,
                kepala_unit: kepalaUnit,
                daftar_form: daftarForm
            };

            try {
                if (idUnit) {
                    // UPDATE
                    const { error } = await supabaseClient.from('master_unit').update(payloadData).eq('id', idUnit);
                    if (error) throw error;
                } else {
                    // Cek apakah nama unit sudah ada (mencegah duplikat)
                    const { data: existing } = await supabaseClient.from('master_unit').select('id').ilike('nama_unit', namaUnit).maybeSingle();
                    if (existing) { Swal.fire('Oops', 'Unit dengan nama tersebut sudah terdaftar!', 'warning'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-2"></i> Simpan Data Unit'; return; }
                    
                    // INSERT
                    const { error } = await supabaseClient.from('master_unit').insert([payloadData]);
                    if (error) throw error;
                }

                Swal.fire({ title: 'Berhasil!', text: 'Konfigurasi unit tersimpan.', icon: 'success', timer: 1500, showConfirmButton: false }).then(() => { 
                    bootstrap.Modal.getInstance(document.getElementById('modalUnit')).hide(); 
                    loadUnits(); 
                });

            } catch (err) {
                console.error(err);
                Swal.fire('Gagal!', 'Terjadi kesalahan saat menyimpan ke Supabase.', 'error');
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-2"></i> Simpan Data Unit';
            }
        };

        // 3. DELETE: HAPUS DATA DARI master_unit
        window.hapusUnit = function(idUnit, namaUnit) {
            Swal.fire({
                title: 'Hapus Permanen?',
                html: `Anda yakin ingin menghapus unit <b>${namaUnit}</b>?<br><small class="text-danger">Akses unit ini ke form akan hilang.</small>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Ya, Hapus!',
                cancelButtonText: 'Batal'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const { error } = await supabaseClient.from('master_unit').delete().eq('id', idUnit);
                        if (error) throw error;
                        
                        Swal.fire('Terhapus!', `Unit ${namaUnit} telah dihapus dari database.`, 'success');
                        loadUnits();
                    } catch (err) {
                        console.error(err);
                        Swal.fire('Gagal', 'Terjadi kesalahan saat menghapus data. Pastikan Policy DELETE diizinkan.', 'error');
                    }
                }
            });
        };
    </script>
</body>
</html>
