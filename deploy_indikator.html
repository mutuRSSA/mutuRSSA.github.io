<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deploy Indikator Mutu - Komite Mutu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 4px 12px rgba(0,0,0,.08); border-radius: 12px; border-top: 5px solid #0d6efd; background: #fff;}
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container" style="max-width: 700px;">
        <div class="card-custom p-4 p-md-5">
            <h4 class="fw-bold mb-1 text-primary"><i class="fas fa-robot me-2"></i> Deploy Indikator ke Unit</h4>
            <p class="text-muted mb-4 border-bottom pb-3">Suntikkan rumus indikator otomatis dari Master ke File Google Sheets masing-masing Unit.</p>

            <form id="formDeploy">
                <div class="mb-3">
                    <label class="fw-bold mb-1">1. Pilih Unit Sasaran</label>
                    <select class="form-select" id="inp_unit" required>
                        <option value="">-- Pilih Unit --</option>
                        <option value="ID_FILE_MUTU_FARMASI_ANDA|Unit Farmasi">Unit Farmasi</option>
                        <option value="ID_FILE_MUTU_IGD_ANDA|Unit Gawat Darurat">Unit Gawat Darurat</option>
                        <option value="ID_FILE_MUTU_RANAP_ANDA|Unit Rawat Inap">Unit Rawat Inap</option>
                        </select>
                </div>

                <div class="mb-3">
                    <label class="fw-bold mb-1">2. Tahun Pengukuran</label>
                    <input type="number" class="form-control" id="inp_tahun" value="2026" required>
                </div>

                <div class="mb-4">
                    <label class="fw-bold mb-1">3. Judul Indikator (Harus persis dengan setup_indikator)</label>
                    <input type="text" class="form-control" id="inp_judul" placeholder="Contoh: Waktu Pelayanan Obat" required>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-pill" id="btnSubmit">
                        <i class="fas fa-paper-plane me-2"></i> Jalankan Robot Deploy
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="components.js"></script>

    <script>
        document.getElementById('formDeploy').addEventListener('submit', function(e) {
            e.preventDefault();

            const unitRaw = document.getElementById('inp_unit').value;
            const tahun = document.getElementById('inp_tahun').value;
            const judul = document.getElementById('inp_judul').value.trim();

            if (!unitRaw) {
                Swal.fire('Perhatian', 'Pilih Unit Sasaran terlebih dahulu!', 'warning');
                return;
            }

            // Memecah Value "ID|NAMA"
            const parts = unitRaw.split('|');
            const idUnit = parts[0];
            const namaUnit = parts[1];

            const payload = {
                action: 'deploy_indikator',
                data: {
                    id_unit: idUnit,
                    nama_unit: namaUnit,
                    tahun: tahun,
                    judul_indikator: judul
                }
            };

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.innerHTML = "<i class='fas fa-spinner fa-spin me-2'></i> Robot sedang bekerja...";
            btnSubmit.disabled = true;

            // Pastikan URL API Mutu Anda benar di config.js
            fetch(API_CONFIG.MUTU, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                if (result.status === 'success') {
                    Swal.fire('Sukses!', result.message, 'success');
                    document.getElementById('inp_judul').value = ""; // Kosongkan input judul
                } else {
                    Swal.fire('Gagal!', 'Error: ' + result.message, 'error');
                }
            })
            .catch(err => Swal.fire('Error Jaringan', 'Tidak dapat terhubung ke server', 'error'))
            .finally(() => {
                btnSubmit.innerHTML = "<i class='fas fa-paper-plane me-2'></i> Jalankan Robot Deploy";
                btnSubmit.disabled = false;
            });
        });
    </script>
</body>
</html>
