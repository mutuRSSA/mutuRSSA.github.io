<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIM PMKP RSUD</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { 
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-top: 5px solid #6f42c1;
        }
        .brand-logo {
            width: 64px;
            height: 64px;
            background: rgba(111, 66, 193, 0.1);
            color: #6f42c1;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px auto;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(111, 66, 193, 0.2);
            border-color: #6f42c1;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="brand-logo">
            <i class="fas fa-hospital-user"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">SIM-PMKP Terpadu</h4>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">Sistem Informasi Manajemen Mutu & Keselamatan Pasien</p>
        
        <form id="formLogin" onsubmit="eksekusiLogin(event)">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.85rem;">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0 fw-bold" id="inp_user" placeholder="Ketik nama pengguna..." required autocomplete="username">
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.85rem;">Kata Sandi (Password)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="inp_pass" placeholder="Ketik kata sandi..." required autocomplete="current-password">
                </div>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn text-white fw-bold py-2 shadow" style="background-color: #6f42c1;" id="btnLogin">
                    <i class="fas fa-sign-in-alt me-2"></i> Masuk ke Sistem
                </button>
            </div>
        </form>
        
        <div class="mt-4 pt-3 border-top">
            <a href="index.html" class="text-decoration-none text-muted" style="font-size: 0.85rem;">
                <i class="fas fa-arrow-left me-1"></i> Kembali ke Beranda Publik
            </a>
        </div>
    </div>

    <!-- 1. WAJIB: Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Muat Konfigurasi Anda -->
    <script src="config.js"></script>

    <script>
        // Bersihkan seluruh sisa sesi lama saat halaman login dibuka
        localStorage.removeItem("sessionMutu");
        localStorage.removeItem("menuMutu");

        async function eksekusiLogin(e) {
            e.preventDefault();

            // PERBAIKAN 1: Gunakan supabaseClient (Sesuai config.js)
            if (!supabaseClient) {
                Swal.fire('Konfigurasi Salah', 'Supabase belum diinisialisasi di config.js', 'error');
                return;
            }

            const inputUsername = document.getElementById('inp_user').value.trim();
            const inputPassword = document.getElementById('inp_pass').value;
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i> Memvalidasi Kredensial...';

            try {
                // PERBAIKAN 2: Semua nama kolom disesuaikan menjadi huruf kecil (lowercase)
                const { data: userData, error: userError } = await supabaseClient
                    .from('users') 
                    .select('*')
                    .eq('username', inputUsername) 
                    .eq('password', inputPassword)
                    .maybeSingle(); 

                if (userError || !userData) {
                    Swal.fire('Akses Ditolak', 'Username atau Password salah!', 'error');
                    resetButton();
                    return;
                }

                // Supabase terkadang sensitif, kita handle variasi huruf untuk 'aktif'
                if (userData.status !== 'Aktif' && userData.status !== 'aktif' && userData.status !== 'AKTIF') {
                    Swal.fire('Akses Ditolak', 'Akun Anda telah dinonaktifkan. Hubungi Komite Mutu.', 'error');
                    resetButton();
                    return;
                }

                let allowedPages = ["index.html", "login.html"];
                
                // Pencarian hak akses dengan huruf kecil
                const { data: roleData, error: roleError } = await supabaseClient
                    .from('role_permissions')
                    .select('allowed_pages')
                    .eq('role', userData.role)
                    .single();

                if (!roleError && roleData && roleData.allowed_pages) {
                    allowedPages = roleData.allowed_pages.split(',').map(s => s.trim()).filter(Boolean);
                }

                if(!allowedPages.includes("index.html")) allowedPages.push("index.html");
                if(!allowedPages.includes("login.html")) allowedPages.push("login.html");

                // PERBAIKAN 3: Memperbaiki variabel allowedPages (P besar) dan ID yang benar
                const sessionPayload = {
                    id_user: userData.id,
                    username: userData.username,
                    nama_lengkap: userData.nama_lengkap,
                    role: userData.role,
                    unit: userData.unit_kerja,
                    allowed_pages: allowedPages // <--- Diperbaiki di sini
                };

                // Simpan ke memori browser
                localStorage.setItem("sessionMutu", JSON.stringify(sessionPayload));
                
                Swal.fire({
                    title: 'Login Berhasil!',
                    text: 'Selamat datang kembali, ' + userData.nama_lengkap,
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "index.html";
                });

            } catch (error) {
                console.error("Login Error: ", error);
                Swal.fire('Masalah Jaringan', 'Gagal menghubungi server database Supabase.', 'error');
                resetButton();
            }

            function resetButton() {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Masuk ke Sistem';
            }
        }
    </script>
</body>
</html>
