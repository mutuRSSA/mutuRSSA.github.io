<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIM PMKP RSUD</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { 
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-top: 5px solid #6f42c1;
        }
        .brand-logo {
            width: 64px;
            height: 64px;
            background: rgba(111, 66, 193, 0.1);
            color: #6f42c1;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px auto;
        }
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(111, 66, 193, 0.2);
            border-color: #6f42c1;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="brand-logo">
            <i class="fas fa-hospital-user"></i>
        </div>
        <h4 class="fw-bold text-dark mb-1">SIM-PMKP Terpadu</h4>
        <p class="text-muted mb-4" style="font-size: 0.9rem;">Sistem Informasi Manajemen Mutu & Keselamatan Pasien</p>
        
        <form id="formLogin" onsubmit="eksekusiLogin(event)">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.85rem;">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0 fw-bold" id="inp_user" placeholder="nama@rsuda.local" required autocomplete="username">
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.85rem;">Kata Sandi (Password)</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="inp_pass" placeholder="Ketik kata sandi..." required autocomplete="current-password">
                </div>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn text-white fw-bold py-2 shadow" style="background-color: #6f42c1;" id="btnLogin">
                    <i class="fas fa-sign-in-alt me-2"></i> Masuk ke Sistem
                </button>
            </div>
        </form>
        
        <div class="mt-4 pt-3 border-top">
            <a href="index.html" class="text-decoration-none text-muted" style="font-size: 0.85rem;">
                <i class="fas fa-arrow-left me-1"></i> Kembali ke Beranda Publik
            </a>
        </div>
    </div>

    <!-- 1. WAJIB: Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 2. Muat Konfigurasi Anda -->
    <script src="config.js"></script>

    <script>
        // Bersihkan seluruh sisa sesi lama saat halaman login dibuka
        localStorage.removeItem("sessionMutu");
        localStorage.removeItem("menuMutu");

        // Jika sudah punya sesi Supabase yang masih valid, langsung lempar ke beranda
        (async function cekSesiExisting() {
            if (!supabaseClient) return;
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                window.location.href = "index.html";
            }
        })();

        async function eksekusiLogin(e) {
            e.preventDefault();

            if (!supabaseClient) {
                Swal.fire('Konfigurasi Salah', 'Supabase belum diinisialisasi di config.js', 'error');
                return;
            }

            const inputEmail = document.getElementById('inp_user').value.trim();
            const inputPassword = document.getElementById('inp_pass').value;
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin me-2"></i> Memvalidasi Kredensial...';

            try {
                // TAHAP 1: Autentikasi asli lewat Supabase Auth (password di-hash di server, tidak pernah kita lihat)
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                    email: inputEmail,
                    password: inputPassword
                });

                if (authError || !authData.user) {
                    Swal.fire('Akses Ditolak', 'Email atau Password salah!', 'error');
                    resetButton();
                    return;
                }

                // TAHAP 2: Ambil data profil (role, unit, hak akses halaman) milik user yang barusan login
                const { data: profil, error: profilError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', authData.user.id)
                    .single();

                if (profilError || !profil) {
                    Swal.fire('Profil Tidak Ditemukan', 'Akun berhasil login tapi data profil belum lengkap. Hubungi Super Admin.', 'error');
                    await supabaseClient.auth.signOut();
                    resetButton();
                    return;
                }

                if (profil.status !== 'Aktif') {
                    Swal.fire('Akses Ditolak', 'Akun Anda telah dinonaktifkan. Hubungi Komite Mutu.', 'error');
                    await supabaseClient.auth.signOut();
                    resetButton();
                    return;
                }

                // TAHAP 3: Ambil allowed_pages dari role_permissions berdasarkan role user
                // (per-role, bukan per-user — sesuai desain tabel role_permissions Anda)
                let allowedPages = ["index.html", "login.html"];
                const { data: roleData } = await supabaseClient
                    .from('role_permissions')
                    .select('allowed_pages')
                    .eq('role', profil.role)
                    .single();

                if (roleData && roleData.allowed_pages) {
                    allowedPages = roleData.allowed_pages.split(',').map(s => s.trim()).filter(Boolean);
                }
                if (!allowedPages.includes("index.html")) allowedPages.push("index.html");
                if (!allowedPages.includes("login.html")) allowedPages.push("login.html");

                // Cache untuk kenyamanan UI/filter query di halaman lain.
                // CATATAN: ini BUKAN mekanisme keamanan — keamanan sesungguhnya ada di
                // sesi Supabase (JWT) + Row Level Security di database.
                const sessionPayload = {
                    id_user: authData.user.id,
                    username: authData.user.email,
                    nama_lengkap: profil.nama_lengkap,
                    role: profil.role,
                    unit: profil.unit_kerja,
                    allowed_pages: allowedPages
                };
                localStorage.setItem("sessionMutu", JSON.stringify(sessionPayload));

                Swal.fire({
                    title: 'Login Berhasil!',
                    text: 'Selamat datang kembali, ' + (profil.nama_lengkap || authData.user.email),
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "index.html";
                });

            } catch (error) {
                console.error("Login Error: ", error);
                Swal.fire('Masalah Jaringan', 'Gagal menghubungi server database Supabase.', 'error');
                resetButton();
            }

            function resetButton() {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Masuk ke Sistem';
            }
        }
    </script>
</body>
</html>
