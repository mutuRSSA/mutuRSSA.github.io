<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Komite Mutu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 400px; width: 100%; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #3c8dbc; }
    </style>
</head>
<body>

    <div class="card bg-white login-card p-4">
        <div class="text-center mb-4">
            <i class="fas fa-user-shield fa-3x text-primary mb-3"></i>
            <h4 class="fw-bold">Login Sistem</h4>
            <p class="text-muted" style="font-size: 0.85rem;">Hanya untuk Komite Mutu & Kepala Unit</p>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" required>
                </div>
            </div>
            
            <button type="submit" id="btnLogin" class="btn btn-primary w-100 fw-bold py-2 mb-3">MASUK</button>
            <a href="index.html" class="btn btn-outline-secondary w-100"><i class="fas fa-arrow-left me-2"></i>Kembali ke Beranda</a>
        </form>
    </div>

    <script>
        // MASUKKAN URL APPS SCRIPT ANDA DI SINI
        const scriptURL = "https://script.google.com/macros/s/AKfycbz3Fwb6Ucg8Z20MDaM9VqDHMgHGHT6jlkVjUBJDqWoG8fqwQziMIkj2TcYgI3SirRSZkA/exec";

        document.getElementById("formLogin").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLogin");
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memeriksa...';
            btn.disabled = true;

            const payload = { action: "login", username: user, password: pass };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === "success") {
                    // Simpan tiket masuk di memori HP/Laptop
                    localStorage.setItem("sessionMutu", JSON.stringify({ username: result.username, role: result.role }));
                    alert("Login Berhasil! Selamat datang, " + result.role);
                    window.location.href = "index.html"; // Lempar kembali ke beranda
                } else {
                    alert(result.message);
                }
            })
            .catch(err => alert("Gangguan koneksi: " + err))
            .finally(() => { btn.innerHTML = 'MASUK'; btn.disabled = false; });
        });
    </script>
</body>
</html>
