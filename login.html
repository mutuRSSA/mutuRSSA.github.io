<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Komite Mutu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tambahkan SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, sans-serif;}
        .login-card { max-width: 400px; width: 100%; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #6f42c1; }
        .input-group-text { border-right: none; background-color: #fff; }
        .form-control { border-left: none; }
        .form-control:focus { box-shadow: none; border-color: #dee2e6; }
        .input-group:focus-within { outline: 0; box-shadow: 0 0 0 .25rem rgba(111,66,193,.25); border-radius: 0.375rem; }
        .toggle-password { cursor: pointer; border-left: none; background-color: #fff; }
    </style>
</head>
<body>

    <div class="card bg-white login-card p-4 border-0">
        <div class="text-center mb-4">
            <i class="fas fa-hospital-user fa-3x mb-3" style="color: #6f42c1;"></i>
            <h4 class="fw-bold text-dark">Portal Komite Mutu</h4>
            <p class="text-muted" style="font-size: 0.85rem;">Login untuk mengakses Dasbor & Laporan</p>
        </div>

        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">Username</label>
                <div class="input-group border rounded">
                    <span class="input-group-text text-muted"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" id="username" placeholder="Masukkan username" required autocomplete="off">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary" style="font-size: 0.9rem;">Password</label>
                <div class="input-group border rounded">
                    <span class="input-group-text text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
                    <span class="input-group-text toggle-password text-muted" id="togglePasswordBtn">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>
            
            <button type="submit" id="btnLogin" class="btn w-100 fw-bold py-2 mb-3 text-white" style="background-color: #6f42c1; border:none;">MASUK KE SISTEM</button>
            <a href="index.html" class="btn btn-light border w-100 text-secondary fw-bold"><i class="fas fa-home me-2"></i>Kembali ke Beranda</a>
        </form>
    </div>

    <!-- Script Pusat Konfigurasi & Autentikasi -->
    <script src="config.js"></script>

    <script>
        // Fitur Toggle Show/Hide Password
        document.getElementById('togglePasswordBtn').addEventListener('click', function() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        document.getElementById("formLogin").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("btnLogin");
            const user = document.getElementById("username").value;
            const pass = document.getElementById("password").value;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Memeriksa Autentikasi...';
            btn.disabled = true;

            const payload = { action: "login", username: user, password: pass };

            // Menggunakan API_CONFIG.AUTH dari config.js
            fetch(API_CONFIG.AUTH, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === "success") {
                    
                    // ========================================================
                    // PEMBARUAN KRUSIAL: Menyimpan UNIT ke dalam LocalStorage
                    // ========================================================
                    localStorage.setItem("sessionMutu", JSON.stringify({ 
                        username: result.username, 
                        role: result.role,
                        unit: result.unit // <--- MENYIMPAN DATA UNIT
                    }));
                    
                    // Menggunakan SweetAlert2 untuk Notifikasi Login Berhasil
                    Swal.fire({
                        title: 'Login Berhasil!',
                        text: `Selamat datang, ${result.username} dari unit ${result.unit}`,
                        icon: 'success',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = "index.html"; 
                    });
                } else {
                    // Menggunakan SweetAlert2 untuk Notifikasi Login Gagal
                    Swal.fire({
                        title: 'Akses Ditolak!',
                        text: result.message,
                        icon: 'error',
                        confirmButtonText: 'Coba Lagi',
                        confirmButtonColor: '#6f42c1'
                    });
                }
            })
            .catch(err => {
                Swal.fire({
                    title: 'Gangguan Koneksi',
                    text: 'Tidak dapat terhubung ke server pusat. Silakan coba lagi.',
                    icon: 'warning',
                    confirmButtonText: 'Tutup',
                    confirmButtonColor: '#6f42c1'
                });
            })
            .finally(() => { 
                btn.innerHTML = 'MASUK KE SISTEM'; 
                btn.disabled = false; 
            });
        });
    </script>
</body>
</html>
