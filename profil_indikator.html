<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Indikator Mutu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f4f6f9; padding-top: 80px; padding-bottom: 40px; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card-custom { box-shadow: 0 4px 12px rgba(0,0,0,.05); border-radius: 12px; border-top: 4px solid #0dcaf0; background: #fff;}
        .accordion-button:not(.collapsed) { background-color: #e0f7fa; color: #0c63e4; font-weight: bold; }
        .table-profil th { background-color: #f8f9fa; width: 30%; font-weight: 600; color: #495057;}
        .table-profil td { color: #212529; white-space: pre-wrap; }
        .box-dimensi { background: #fff; border: 1px solid #ced4da; padding: 10px; border-radius: 6px; }
        .form-check-label { cursor: help; } 
    </style>
</head>
<body>
    <div id="navbar-container"></div>
    <div id="sidebar-container"></div>

    <div class="container-fluid px-4" style="max-width: 1100px;">
        <div class="bg-white p-4 mb-4 card-custom">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4 flex-wrap gap-3">
                <div>
                    <h4 class="mb-1 text-dark fw-bold"><i class="fas fa-book-medical text-primary me-2"></i> Kamus Profil Indikator Mutu</h4>
                    <p class="text-muted mb-0">Referensi lengkap definisi operasional, formula, dan standar pengukuran mutu rumah sakit.</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary fw-bold shadow-sm" onclick="cetakProfil(null)">
                        <i class="fas fa-print me-1"></i> Cetak Semua Kamus
                    </button>
                    <div id="adminControls" class="d-none">
                        <button class="btn btn-primary fw-bold shadow-sm" onclick="bukaModalForm(null)">
                            <i class="fas fa-plus me-1"></i> Tambah Profil Baru
                        </button>
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="searchInput" placeholder="Cari nama indikator atau kata kunci definisi..." onkeyup="filterKamus()">
                </div>
            </div>

            <div id="loadingMessage" class="alert alert-info text-center fw-bold shadow-sm"><i class="fas fa-spinner fa-spin me-2"></i> Mengambil data kamus indikator...</div>
            <div class="accordion shadow-sm" id="accordionKamus"></div>
            <div id="noDataMessage" class="alert alert-warning text-center mt-3 fw-bold" style="display: none;">
                <i class="fas fa-exclamation-circle me-2"></i> Belum ada profil indikator yang ditambahkan ke kamus.
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalFormProfil" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="modalTitle"><i class="fas fa-edit me-2"></i> Form Kamus Indikator</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-light">
                    <form id="formProfil">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="fw-bold mb-1">ID Form / Kode Kriteria <span class="text-danger">*</span></label>
                                <select class="form-select fw-bold text-primary border-primary" id="inp_ID_Form" required>
                                    <option value="">-- Pilih ID Form dari Sistem --</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="fw-bold mb-1">Kategori Indikator <span class="text-danger">*</span></label>
                                <select class="form-select fw-bold text-dark" id="inp_Kategori_Indikator">
                                    <option value="Indikator Mutu Nasional">Indikator Mutu Nasional</option>
                                    <option value="IMP-RS">IMP-RS</option>
                                    <option value="IMP-Unit">IMP-Unit</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="fw-bold mb-1">Arah Target Pencapaian <span class="text-danger">*</span></label>
                                <select class="form-select fw-bold text-dark" id="inp_Arah_Target">
                                    <option value="Positif">Positif (Semakin Tinggi Semakin Baik)</option>
                                    <option value="Negatif">Negatif (Semakin Rendah Semakin Baik)</option>
                                </select>
                            </div>

                            <div class="col-md-12">
                                <label class="fw-bold mb-1 text-dark">Judul Indikator / Sub-Indikator Mutu <span class="text-danger">*</span></label>
                                <input type="text" class="form-control fw-bold border-dark text-dark" id="inp_Judul_Indikator" placeholder="Contoh: Kepatuhan Identifikasi Pasien atau Insidensi Phlebitis ICU" required>
                            </div>

                            <div class="col-md-6">
                                <label class="fw-bold mb-1 text-dark">Satuan <span class="text-danger">*</span></label>
                                <input type="text" class="form-control fw-bold" id="inp_Satuan" placeholder="Contoh: % , Per mil, Menit, atau Orang" required>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1 text-dark">Target Sasaran <span class="text-danger">*</span></label>
                                <input type="text" class="form-control fw-bold" id="inp_Target" placeholder="Contoh: 85 , 100, atau 0" required>
                            </div>

                            <div class="col-md-12">
                                <label class="fw-bold mb-1">Dasar Pemikiran</label>
                                <textarea class="form-control" id="inp_Dasar_Pemikiran" rows="2"></textarea>
                            </div>
                            
                            <div class="col-md-12">
                                <label class="fw-bold mb-1 text-primary"><i class="fas fa-tasks me-1"></i> Dimensi Mutu (Bisa Pilih > 1) <small class="text-muted fw-normal ms-2">Arahkan kursor ke pilihan untuk melihat deskripsi</small></label>
                                <div class="box-dimensi d-flex flex-wrap gap-4">
                                    <div class="form-check" title="Layanan yang diberikan tidak menimbulkan risiko atau cedera (keselamatan pasien).">
                                        <input class="form-check-input chk-dimensi" type="checkbox" value="Aman" id="d_aman">
                                        <label class="form-check-label fw-semibold" for="d_aman">Aman</label>
                                    </div>
                                    <div class="form-check" title="Layanan yang menghargai dan merespons kebutuhan, nilai, serta preferensi masing-masing individu.">
                                        <input class="form-check-input chk-dimensi" type="checkbox" value="Berorientasi pada Pasien" id="d_pasien">
                                        <label class="form-check-label fw-semibold" for="d_pasien">Berorientasi pada Pasien</label>
                                    </div>
                                    <div class="form-check" title="Layanan yang diberikan berbasis bukti medis (evidence-based) dan memberikan hasil klinis yang diharapkan.">
                                        <input class="form-check-input chk-dimensi" type="checkbox" value="Efektif" id="d_efektif">
                                        <label class="form-check-label fw-semibold" for="d_efektif">Efektif</label>
                                    </div>
                                    <div class="form-check" title="Pelayanan dilakukan secara optimal tanpa pemborosan biaya, waktu, dan sumber daya.">
                                        <input class="form-check-input chk-dimensi" type="checkbox" value="Efisien" id="d_efisien">
                                        <label class="form-check-label fw-semibold" for="d_efisien">Efisien</label>
                                    </div>
                                    <div class="form-check" title="Pelayanan diberikan merata kepada semua orang tanpa diskriminasi terkait gender, ras, status, maupun kondisi geografis.">
                                        <input class="form-check-input chk-dimensi" type="checkbox" value="Adil" id="d_adil">
                                        <label class="form-check-label fw-semibold" for="d_adil">Adil</label>
                                    </div>
                                    <div class="form-check" title="Pelayanan diberikan dalam rentang waktu yang tidak merugikan atau membahayakan kondisi pasien.">
                                        <input class="form-check-input chk-dimensi" type="checkbox" value="Tepat Waktu" id="d_waktu">
                                        <label class="form-check-label fw-semibold" for="d_waktu">Tepat Waktu</label>
                                    </div>
                                    <div class="form-check" title="Layanan yang berkesinambungan dan terhubung dengan baik di setiap tahapan perawatan pasien.">
                                        <input class="form-check-input chk-dimensi" type="checkbox" value="Terintegrasi" id="d_integrasi">
                                        <label class="form-check-label fw-semibold" for="d_integrasi">Terintegrasi</label>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-12">
                                <label class="fw-bold mb-1">Jenis Indikator <span class="text-danger">*</span></label>
                                <select class="form-select fw-bold text-dark" id="inp_Jenis_Indikator">
                                    <option value="input">input</option>
                                    <option value="proses">proses</option>
                                    <option value="output">output</option>
                                    <option value="outcome">outcome</option>
                                    <option value="proses dan output">proses dan output</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="fw-bold mb-1">Tujuan</label>
                                <textarea class="form-control" id="inp_Tujuan" rows="2"></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="fw-bold mb-1">Definisi Operasional</label>
                                <textarea class="form-control" id="inp_Definisi_Operasional" rows="3"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1 text-success">Kriteria Inklusi</label>
                                <textarea class="form-control" id="inp_Kriteria_Inklusi" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1 text-danger">Kriteria Eksklusi</label>
                                <textarea class="form-control" id="inp_Kriteria_Eksklusi" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1 text-primary">Numerator (Pembilang)</label>
                                <textarea class="form-control" id="inp_Numerator" rows="2"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="fw-bold mb-1 text-primary">Denominator (Penyebut)</label>
                                <textarea class="form-control" id="inp_Denominator" rows="2"></textarea>
                            </div>
                            <div class="col-md-12">
                                <label class="fw-bold mb-1">Formula Perhitungan</label>
                                <input type="text" class="form-control fw-bold" id="inp_Formula">
                            </div>
                            
                            <div class="col-md-12">
                                <label class="fw-bold mb-1">Cara Penilaian</label>
                                <textarea class="form-control" id="inp_Cara_Penilaian" rows="3" placeholder="Deskripsi tata cara penilaian..."></textarea>
                            </div>
                            
                            <div class="col-md-6"><label class="fw-bold mb-1">Metode Pengumpulan Data</label><input type="text" class="form-control" id="inp_Metode_Pengumpulan_Data"></div>
                            <div class="col-md-6"><label class="fw-bold mb-1">Sumber Data</label><input type="text" class="form-control" id="inp_Sumber_Data"></div>
                            <div class="col-md-6"><label class="fw-bold mb-1">Instrumen Pengambilan Data</label><input type="text" class="form-control" id="inp_Instrumen_Pengambilan_Data"></div>
                            <div class="col-md-6"><label class="fw-bold mb-1">Besar Sampel</label><input type="text" class="form-control" id="inp_Besar_Sampel"></div>
                            <div class="col-md-12"><label class="fw-bold mb-1">Cara Pengambilan Sampel</label><input type="text" class="form-control" id="inp_Cara_Pengambilan_Sampel"></div>
                            
                            <div class="col-md-4">
                                <label class="fw-bold mb-1">Periode Pengumpulan Data</label>
                                <select class="form-select text-dark" id="inp_Periode_Pengumpulan_Data">
                                    <option value="harian">harian</option>
                                    <option value="bulanan">bulanan</option>
                                    <option value="triwulan">triwulan</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="fw-bold mb-1">Periode Pelaporan Data</label>
                                <select class="form-select text-dark" id="inp_Periode_Pelaporan_Data">
                                    <option value="harian">harian</option>
                                    <option value="bulanan">bulanan</option>
                                    <option value="triwulan">triwulan</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="fw-bold mb-1">Periode Analisis Data</label>
                                <select class="form-select text-dark" id="inp_Periode_Analisis_Data">
                                    <option value="harian">harian</option>
                                    <option value="bulanan">bulanan</option>
                                    <option value="triwulan">triwulan</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6"><label class="fw-bold mb-1">Penyajian Data</label><input type="text" class="form-control" id="inp_Penyajian_Data"></div>
                            <div class="col-md-6"><label class="fw-bold mb-1">Penanggung Jawab</label><input type="text" class="form-control" id="inp_Penanggung_Jawab"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-white border-top">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                    <button type="button" class="btn btn-primary fw-bold" id="btnSimpan" onclick="simpanProfil()">
                        <i class="fas fa-save me-1"></i> Simpan ke Database
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const scriptURL = API_CONFIG.MUTU;
        const sessionMutu = JSON.parse(localStorage.getItem("sessionMutu")) || {};
        const role = sessionMutu.role || "";
        const userUnit = sessionMutu.unit || "GUEST";
        
        let rawKamusData = [];
        let currentEditingJudul = ""; 

        document.addEventListener("DOMContentLoaded", function () {
            if (role === "Komite Mutu") {
                document.getElementById('adminControls').classList.remove('d-none');
            }
            muatDataKamus();
        });

        function muatDataKamus() {
            // FITUR FILTER UNIT: Periksa apakah user adalah Komite Mutu atau Unit biasa
            if (role !== "Komite Mutu") {
                // Fetch daftar formulir yang diizinkan untuk unit ini dari database
                fetch(`${scriptURL}?action=get_menu&unit=${encodeURIComponent(userUnit)}`)
                .then(res => res.json())
                .then(resMenu => {
                    let allowedForms = resMenu.menu || [];
                    ambilDanFilterKamus(allowedForms);
                })
                .catch(err => {
                    document.getElementById('loadingMessage').innerHTML = `<i class="fas fa-exclamation-triangle text-danger me-2"></i> Gagal memeriksa hak akses unit.`;
                });
            } else {
                // Jika Komite Mutu, jangan berikan batasan filter (Bisa lihat semua)
                ambilDanFilterKamus(null);
            }
        }

        function ambilDanFilterKamus(allowedForms) {
            fetch(`${scriptURL}?action=get_profil_indikator`)
                .then(res => res.json())
                .then(result => {
                    document.getElementById('loadingMessage').style.display = 'none';
                    if (result.status === 'success') {
                        
                        let dataKamus = result.data;

                        // 1. PENYARINGAN BERDASARKAN IZIN AKSES UNIT
                        if (allowedForms !== null) {
                            dataKamus = dataKamus.filter(row => {
                                let idForm = row['ID_Form'] || row['ID Form'] || row['Kolom_Kriteria'] || "";
                                return allowedForms.includes(idForm);
                            });
                        }

                        // 2. PENGURUTAN (SORTING) PRIORITAS NASIONAL -> RS -> UNIT
                        const bobotKategori = {
                            "Indikator Mutu Nasional": 1,
                            "IMP-RS": 2,
                            "IMP-Unit": 3
                        };

                        dataKamus.sort((a, b) => {
                            let katA = (a['Kategori Indikator'] || "Lainnya").trim();
                            let katB = (b['Kategori Indikator'] || "Lainnya").trim();
                            let skorA = bobotKategori[katA] || 99; // Jika kategori tidak dikenal, taruh paling bawah
                            let skorB = bobotKategori[katB] || 99;
                            return skorA - skorB;
                        });

                        rawKamusData = dataKamus;
                        
                        // Menyiapkan dropdown ID Form
                        const selectEl = document.getElementById('inp_ID_Form');
                        selectEl.innerHTML = '<option value="">-- Pilih ID Form dari Sistem --</option>';
                        if (result.mapping) {
                            for (const idForm of Object.keys(result.mapping)) {
                                let safeId = idForm.replace(/\s+/g, '_'); 
                                selectEl.innerHTML += `<option value="${safeId}">${safeId}</option>`;
                            }
                        }

                        renderAccordion(rawKamusData);
                    } else {
                        Swal.fire('Gagal!', "Tidak dapat memuat kamus.", 'error');
                    }
                })
                .catch(err => {
                    document.getElementById('loadingMessage').innerHTML = '<i class="fas fa-wifi text-danger me-2"></i> Gagal menyambung ke database.';
                });
        }

        function renderAccordion(data) {
            const container = document.getElementById('accordionKamus');
            container.innerHTML = '';

            if (data.length === 0) {
                document.getElementById('noDataMessage').style.display = 'block';
                return;
            }

            data.forEach((row, index) => {
                let idForm = row['ID_Form'] || row['ID Form'] || `Unknown_${index}`;
                let judulIndikator = row['Judul Indikator'] || row['Kolom_Kriteria'] || "-";
                let kategori = row['Kategori Indikator'] || "-";
                let jenis = row['Jenis Indikator'] || "-";

                let btnCetakSatu = `<button class="btn btn-sm btn-outline-secondary ms-2" onclick="cetakProfil(${index}); event.stopPropagation();" title="Cetak Kamus Ini"><i class="fas fa-print"></i> Cetak DO</button>`;
                
                let btnEdit = (role === "Komite Mutu") 
                    ? `<button class="btn btn-sm btn-outline-primary ms-2" onclick="bukaModalForm(${index}); event.stopPropagation();"><i class="fas fa-edit"></i> Edit DO</button>` 
                    : ``;

                const fields = [
                    { label: "ID Form / Kode", key: "ID_Form" },
                    { label: "Kategori Indikator", key: "Kategori Indikator" },
                    { label: "Satuan", key: "Satuan" },
                    { label: "Target Sasaran", key: "Target" },
                    { label: "Arah Target", key: "Arah Target" },
                    { label: "Dasar Pemikiran", key: "Dasar Pemikiran" },
                    { label: "Dimensi Mutu", key: "Dimensi Mutu" },
                    { label: "Tujuan", key: "Tujuan" },
                    { label: "Definisi Operasional", key: "Definisi Operasional" },
                    { label: "Jenis Indikator", key: "Jenis Indikator" },
                    { label: "Numerator (Pembilang)", key: "Numerator" },
                    { label: "Denominator (Penyebut)", key: "Denominator" },
                    { label: "Kriteria Inklusi", key: "Kriteria Inklusi" },
                    { label: "Kriteria Eksklusi", key: "Kriteria Eksklusi" },
                    { label: "Formula Perhitungan", key: "Formula" },
                    { label: "Cara Penilaian", key: "Cara Penilaian" },
                    { label: "Metode Pengumpulan Data", key: "Metode Pengumpulan Data" },
                    { label: "Sumber Data", key: "Sumber Data" },
                    { label: "Instrumen Pengambilan Data", key: "Instrumen Pengambilan Data" },
                    { label: "Besar Sampel", key: "Besar Sampel" },
                    { label: "Cara Pengambilan Sampel", key: "Cara Pengambilan Sampel" },
                    { label: "Periode Pengumpulan Data", key: "Periode Pengumpulan Data" },
                    { label: "Periode Pelaporan Data", key: "Periode Pelaporan Data" },
                    { label: "Periode Analisis Data", key: "Periode Analisis Data" },
                    { label: "Penyajian Data", key: "Penyajian Data" },
                    { label: "Penanggung Jawab", key: "Penanggung Jawab" }
                ];

                let tbodyHtml = '';
                fields.forEach(f => {
                    let val = row[f.key] || "-";
                    if (f.key === "Arah Target") {
                        let badgeColor = val === "Negatif" ? "bg-danger" : "bg-success";
                        val = `<span class="badge ${badgeColor}">${val}</span>`;
                    }
                    tbodyHtml += `<tr><th style="background:#f8f9fa;">${f.label}</th><td>${val}</td></tr>`;
                });

                // Memberi label warna berbeda berdasarkan kategori indikator
                let colorBadge = "bg-secondary";
                if(kategori.trim() === "Indikator Mutu Nasional") colorBadge = "bg-primary";
                else if(kategori.trim() === "IMP-RS") colorBadge = "bg-success";

                let html = `
                <div class="accordion-item mb-2 border rounded overflow-hidden kamus-item">
                    <h2 class="accordion-header" id="heading${index}">
                        <button class="accordion-button collapsed d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${index}">
                            <span><i class="fas fa-file-medical text-info me-2"></i><b>${judulIndikator.toUpperCase()}</b> <span class="badge ${colorBadge} ms-2">${kategori}</span> <span class="badge bg-dark ms-1">${jenis}</span></span>
                            <div class="d-flex align-items-center">
                                ${btnCetakSatu}
                                ${btnEdit}
                            </div>
                        </button>
                    </h2>
                    <div id="collapse${index}" class="accordion-collapse collapse" data-bs-parent="#accordionKamus">
                        <div class="accordion-body bg-white p-3">
                            <div class="table-responsive">
                                <table class="table table-bordered table-profil mb-0 bg-white">
                                    <tbody>${tbodyHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>`;
                container.innerHTML += html;
            });
        }

        function filterKamus() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let items = document.querySelectorAll('.kamus-item');
            items.forEach(item => {
                let text = item.innerText.toLowerCase();
                item.style.display = text.includes(input) ? '' : 'none';
            });
        }

        window.cetakProfil = function(index) {
            let dataToPrint = [];
            
            if (index !== null) {
                dataToPrint.push(rawKamusData[index]);
            } else {
                dataToPrint = rawKamusData;
            }

            if (dataToPrint.length === 0) {
                Swal.fire('Informasi', 'Tidak ada data kamus untuk dicetak.', 'info');
                return;
            }

            let htmlArr = [];
            htmlArr.push('<!DOCTYPE html>');
            htmlArr.push('<html>');
            htmlArr.push('<head>');
            htmlArr.push('<title>Cetak Kamus Indikator</title>');
            htmlArr.push('<style>');
            htmlArr.push('body { font-family: Arial, sans-serif; font-size: 13px; color: #000; padding: 20px; }');
            htmlArr.push('h2 { text-align: center; margin-bottom: 5px; font-size: 18px; text-transform: uppercase; }');
            htmlArr.push('.kategori-subtitle { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 25px; color: #555; }');
            htmlArr.push('table { width: 100%; border-collapse: collapse; margin-bottom: 30px; page-break-inside: auto; }');
            htmlArr.push('tr { page-break-inside: auto; page-break-after: auto; }');
            htmlArr.push('th, td { border: 1px solid #000; padding: 8px 10px; vertical-align: top; }');
            htmlArr.push('th { background-color: #f2f2f2; width: 30%; text-align: left; }');
            htmlArr.push('td { white-space: pre-wrap; text-align: justify; text-justify: inter-word; }');
            htmlArr.push('.page-break { page-break-after: always; }');
            htmlArr.push('@media print { @page { margin: 1.5cm; } }');
            htmlArr.push('</style>');
            htmlArr.push('</head>');
            htmlArr.push('<body>');

            const printFields = [
                { label: "Dasar Pemikiran", key: "Dasar Pemikiran" },
                { label: "Dimensi Mutu", key: "Dimensi Mutu" },
                { label: "Tujuan", key: "Tujuan" },
                { label: "Definisi Operasional", key: "Definisi Operasional" },
                { label: "Jenis Indikator", key: "Jenis Indikator" },
                { label: "Satuan & Target", key: "Target_Gabung" },
                { label: "Numerator (Pembilang)", key: "Numerator" },
                { label: "Denominator (Penyebut)", key: "Denominator" },
                { label: "Kriteria Inklusi", key: "Kriteria Inklusi" },
                { label: "Kriteria Eksklusi", key: "Kriteria Eksklusi" },
                { label: "Formula Perhitungan", key: "Formula" },
                { label: "Cara Penilaian", key: "Cara Penilaian" },
                { label: "Metode Pengumpulan Data", key: "Metode Pengumpulan Data" },
                { label: "Sumber Data", key: "Sumber Data" },
                { label: "Instrumen Pengambilan Data", key: "Instrumen Pengambilan Data" },
                { label: "Besar Sampel", key: "Besar Sampel" },
                { label: "Cara Pengambilan Sampel", key: "Cara Pengambilan Sampel" },
                { label: "Periode Pengumpulan Data", key: "Periode Pengumpulan Data" },
                { label: "Periode Pelaporan Data", key: "Periode Pelaporan Data" },
                { label: "Periode Analisis Data", key: "Periode Analisis Data" },
                { label: "Penyajian Data", key: "Penyajian Data" },
                { label: "Penanggung Jawab", key: "Penanggung Jawab" }
            ];

            dataToPrint.forEach((row, i) => {
                let judul = row['Judul Indikator'] || row['Kolom_Kriteria'] || "-";
                let kategori = row['Kategori Indikator'] || "-";
                
                htmlArr.push('<h2>PROFIL INDIKATOR MUTU<br>' + judul + '</h2>');
                htmlArr.push('<div class="kategori-subtitle">Kategori: ' + kategori + '</div>');
                htmlArr.push('<table><tbody>');

                printFields.forEach(f => {
                    let val = "";
                    if (f.key === "Target_Gabung") {
                        let targetVal = row['Target'] || "-";
                        let satuanVal = row['Satuan'] || "";
                        let arahVal = row['Arah Target'] === "Negatif" ? "Semakin Rendah Semakin Baik" : "Semakin Tinggi Semakin Baik";
                        val = targetVal + ' ' + satuanVal + '<br>(Arah: ' + arahVal + ')';
                    } else {
                        val = row[f.key] || "-";
                    }
                    htmlArr.push('<tr><th>' + f.label + '</th><td>' + val + '</td></tr>');
                });

                htmlArr.push('</tbody></table>');
                if (i < dataToPrint.length - 1) {
                    htmlArr.push('<div class="page-break"></div>');
                }
            });

            htmlArr.push('<' + '/body>');
            htmlArr.push('<' + '/html>');

            let htmlCetak = htmlArr.join('');

            let printWindow = window.open('', '_blank');
            printWindow.document.open(); 
            printWindow.document.write(htmlCetak);
            printWindow.document.close();

            setTimeout(function() {
                printWindow.focus();
                printWindow.print();
            }, 500);
        };

        window.bukaModalForm = function(index) {
            document.getElementById('formProfil').reset();
            document.querySelectorAll('.chk-dimensi').forEach(c => c.checked = false);
            let selectId = document.getElementById('inp_ID_Form');

            if (index !== null) {
                let data = rawKamusData[index];
                document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit me-2"></i> Edit Profil Indikator';
                
                let valId = data['ID_Form'] || data['ID Form'] || "";
                valId = valId.replace(/\s+/g, '_'); 
                
                selectId.value = valId;
                selectId.disabled = true; 
                
                document.getElementById('inp_Judul_Indikator').value = data['Judul Indikator'] || "";
                currentEditingJudul = data['Judul Indikator'] || ""; 

                let dimensiStr = data['Dimensi Mutu'] || "";
                if(dimensiStr !== "-") {
                    dimensiStr.split(',').map(s => s.trim()).forEach(val => {
                        document.querySelectorAll('.chk-dimensi').forEach(chk => {
                            if(chk.value.toLowerCase() === val.toLowerCase()) chk.checked = true;
                        });
                    });
                }
                
                const mapField = (id, key) => { 
                    if(document.getElementById(id)) {
                        document.getElementById(id).value = data[key] || ""; 
                    }
                };
                
                mapField('inp_Kategori_Indikator', 'Kategori Indikator');
                mapField('inp_Arah_Target', 'Arah Target');
                mapField('inp_Satuan', 'Satuan'); 
                mapField('inp_Target', 'Target'); 
                mapField('inp_Dasar_Pemikiran', 'Dasar Pemikiran');
                mapField('inp_Jenis_Indikator', 'Jenis Indikator');
                mapField('inp_Tujuan', 'Tujuan');
                mapField('inp_Definisi_Operasional', 'Definisi Operasional');
                mapField('inp_Numerator', 'Numerator');
                mapField('inp_Denominator', 'Denominator');
                mapField('inp_Formula', 'Formula');
                mapField('inp_Cara_Penilaian', 'Cara Penilaian');
                mapField('inp_Metode_Pengumpulan_Data', 'Metode Pengumpulan Data');
                mapField('inp_Sumber_Data', 'Sumber Data');
                mapField('inp_Instrumen_Pengambilan_Data', 'Instrumen Pengambilan Data');
                mapField('inp_Besar_Sampel', 'Besar Sampel');
                mapField('inp_Cara_Pengambilan_Sampel', 'Cara Pengambilan Sampel');
                mapField('inp_Periode_Pengumpulan_Data', 'Periode Pengumpulan Data');
                mapField('inp_Periode_Pelaporan_Data', 'Periode Pelaporan Data');
                mapField('inp_Periode_Analisis_Data', 'Periode Analisis Data');
                mapField('inp_Penyajian_Data', 'Penyajian Data');
                mapField('inp_Penanggung_Jawab', 'Penanggung Jawab');
            } else {
                document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus me-2"></i> Tambah Profil Baru';
                selectId.disabled = false;
                currentEditingJudul = "";
                document.getElementById('inp_Kategori_Indikator').value = "Indikator Mutu Nasional";
                document.getElementById('inp_Arah_Target').value = "Positif"; 
                document.getElementById('inp_Jenis_Indikator').value = "proses";
                document.getElementById('inp_Periode_Pengumpulan_Data').value = "bulanan";
                document.getElementById('inp_Periode_Pelaporan_Data').value = "bulanan";
                document.getElementById('inp_Periode_Analisis_Data').value = "bulanan";
            }

            new bootstrap.Modal(document.getElementById('modalFormProfil')).show();
        };

        window.simpanProfil = function() {
            let idFormRaw = document.getElementById('inp_ID_Form').value.trim();
            let idForm = idFormRaw.replace(/\s+/g, '_'); 
            
            if(!idForm) { Swal.fire('Peringatan', 'Silakan tentukan pilihan ID Form!', 'warning'); return; }

            let judulIndikatorBaru = document.getElementById('inp_Judul_Indikator').value.trim();
            if(!judulIndikatorBaru) { Swal.fire('Peringatan', 'Judul Indikator tidak boleh kosong!', 'warning'); return; }

            let checkedDimensi = [];
            document.querySelectorAll('.chk-dimensi:checked').forEach(chk => {
                checkedDimensi.push(chk.value);
            });
            let dimensiMutuStr = checkedDimensi.length > 0 ? checkedDimensi.join(', ') : "-";

            let btn = document.getElementById('btnSimpan');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menyimpan...';
            btn.disabled = true;

            const payloadData = {
                "ID_Form": idForm,
                "Judul Indikator": judulIndikatorBaru, 
                "Kategori Indikator": document.getElementById('inp_Kategori_Indikator').value,
                "Arah Target": document.getElementById('inp_Arah_Target').value,
                "Satuan": document.getElementById('inp_Satuan').value, 
                "Target": document.getElementById('inp_Target').value, 
                "Dasar Pemikiran": document.getElementById('inp_Dasar_Pemikiran').value,
                "Dimensi Mutu": dimensiMutuStr,
                "Tujuan": document.getElementById('inp_Tujuan').value,
                "Definisi Operasional": document.getElementById('inp_Definisi_Operasional').value,
                "Jenis Indikator": document.getElementById('inp_Jenis_Indikator').value,
                "Numerator": document.getElementById('inp_Numerator').value,
                "Denominator": document.getElementById('inp_Denominator').value,
                "Formula": document.getElementById('inp_Formula').value,
                "Cara Penilaian": document.getElementById('inp_Cara_Penilaian').value,
                "Metode Pengumpulan Data": document.getElementById('inp_Metode_Pengumpulan_Data').value,
                "Sumber Data": document.getElementById('inp_Sumber_Data').value,
                "Instrumen Pengambilan Data": document.getElementById('inp_Instrumen_Pengambilan_Data').value,
                "Besar Sampel": document.getElementById('inp_Besar_Sampel').value,
                "Cara Pengambilan Sampel": document.getElementById('inp_Cara_Pengambilan_Sampel').value,
                "Periode Pengumpulan Data": document.getElementById('inp_Periode_Pengumpulan_Data').value,
                "Periode Pelaporan Data": document.getElementById('inp_Periode_Pelaporan_Data').value,
                "Periode Analisis Data": document.getElementById('inp_Periode_Analisis_Data').value,
                "Penyajian Data": document.getElementById('inp_Penyajian_Data').value,
                "Penanggung Jawab": document.getElementById('inp_Penanggung_Jawab').value
            };

            fetch(scriptURL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: 'save_profil_indikator', role: role, old_judul_indikator: currentEditingJudul, data: payloadData })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    Swal.fire({ title: 'Berhasil!', text: 'Kamus profil indikator diperbarui.', icon: 'success', timer: 1500, showConfirmButton: false })
                    .then(() => {
                        localStorage.removeItem("KAMUS_" + idForm);
                        location.reload();
                    });
                } else {
                    Swal.fire('Gagal!', res.message, 'error');
                    resetBtn();
                }
            }).catch(err => {
                Swal.fire('Error', 'Gagal menyambung ke server.', 'error');
                resetBtn();
            });

            function resetBtn() { btn.innerHTML = '<i class="fas fa-save me-1"></i> Simpan ke Database'; btn.disabled = false; }
        };
    </script>
</body>
